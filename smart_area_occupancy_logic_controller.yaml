          default: -1.5
          selector:
            number:
              min: -90
              max: 90
              step: 0.1
              unit_of_measurement: "°"

variables:
  # ============================================================================
  # STATIC VARIABLES - derived from blueprint inputs.
  # Anything that reads entity states lives in the first `actions` step so it is
  # evaluated when the run actually EXECUTES (important for mode: queued).
  # ============================================================================
  base_occ: !input base_occ
  smart_occ_helper: !input smart_occ_helper
  smart_occ_sensor: !input smart_occ_sensor
  # Where smart occupancy is remembered between runs. '' = no helper/sensor (stateless mode)
  storage_entity: >-
    {{ smart_occ_sensor if smart_occ_sensor | length > 0
       else (smart_occ_helper if smart_occ_helper | length > 0 else '') }}
  stateless: "{{ storage_entity | length == 0 }}"

  # --- Light targets ---
  light_target: !input light_target
  off_light_target: !input off_light_target
  lighting_script: !input lighting_script
  off_behavior: !input off_behavior
  script_field_key: !input script_field_key
  final_field_name: "{{ script_field_key if script_field_key | length > 0 else 'state' }}"

  # Areas / devices / labels only contribute lights and switches (never every scene or script in the area)
  light_target_entities: >-
    {%- set t = light_target if light_target is mapping else {} -%}
    {%- set direct = t.get('entity_id', []) -%}
    {%- set direct = [direct] if direct is string else direct -%}
    {%- set areas = t.get('area_id', []) -%}
    {%- set areas = [areas] if areas is string else areas -%}
    {%- set devices = t.get('device_id', []) -%}
    {%- set devices = [devices] if devices is string else devices -%}
    {%- set labels = t.get('label_id', []) -%}
    {%- set labels = [labels] if labels is string else labels -%}
    {%- set indirect = (areas | map('area_entities') | sum(start=[]))
                     + (devices | map('device_entities') | sum(start=[]))
                     + (labels | map('label_entities') | sum(start=[])) -%}
    {{ (direct + (indirect | select('match', '(light|switch)[.]') | list)) | unique | list }}

  off_target_entities: >-
    {%- set t = off_light_target if off_light_target is mapping else {} -%}
    {%- set direct = t.get('entity_id', []) -%}
    {{ [direct] if direct is string else direct }}

  # Split by domain WITHOUT expand() so light groups are controlled as one entity
  light_entities: "{{ light_target_entities | select('search', '^light[.]') | list }}"
  switch_entities: "{{ light_target_entities | select('search', '^switch[.]') | list }}"
  switchable_entities: "{{ light_entities + switch_entities }}"
  scene_entities: "{{ light_target_entities | select('search', '^scene[.]') | list }}"
  # The secondary lighting script is called on its own - never twice
  script_entities: "{{ light_target_entities | select('search', '^script[.]') | reject('eq', lighting_script) | list }}"
  off_scene_entities: "{{ off_target_entities | select('search', '^scene[.]') | list }}"
  off_script_entities: >-
    {{ script_entities if off_behavior == 'repeat'
       else (off_target_entities | select('search', '^script[.]') | reject('eq', lighting_script) | list) }}

  # --- Automation Control ---
  use_automation_control: !input use_automation_control
  automation_control_entity: !input automation_control_entity
  automation_control_state: !input automation_control_state
  fallback_state_sensor: !input fallback_state_sensor

  # --- Light Control Skip ---
  use_light_skip: !input use_light_skip
  light_skip_entity: !input light_skip_entity
  light_skip_state: !input light_skip_state
  light_skip_triggered_on_state: !input light_skip_triggered_on_state
  light_skip_triggered_off_state: !input light_skip_triggered_off_state
  light_skip_type_on: !input light_skip_type_on
  light_skip_enabled: "{{ use_light_skip == 'light_control_skip_enabled' and light_skip_entity | length > 0 }}"

  # --- Smart Occupancy Logic Controls ---
  smart_occ_rising_edge: !input smart_occ_rising_edge
  smart_occ_rising_edge_type_on: !input smart_occ_rising_edge_type_on
  smart_occ_detected_hold_rising_edge: !input smart_occ_detected_hold_rising_edge
  smart_occ_falling_edge: !input smart_occ_falling_edge
  smart_occ_falling_edge_type_off: !input smart_occ_falling_edge_type_off
  smart_occ_cleared_hold_falling_edge: !input smart_occ_cleared_hold_falling_edge
  smart_occ_hold_priority: !input smart_occ_hold_priority

  # --- Entering / Leaving / Holds ---
  use_entering: !input use_entering
  entering_sensors: !input entering_sensors
  entering_sensor_control_state: !input entering_sensor_control_state
  entering_type_on: !input entering_type_on
  entering_type_off: !input entering_type_off
  entering_enabled: "{{ use_entering == 'use_entering_enabled' and entering_sensors | length > 0 }}"

  use_leaving: !input use_leaving
  leaving_sensors: !input leaving_sensors
  leaving_sensor_control_state: !input leaving_sensor_control_state
  leaving_type_on: !input leaving_type_on
  leaving_type_off: !input leaving_type_off
  leaving_enabled: "{{ use_leaving == 'use_leaving_enabled' and leaving_sensors | length > 0 }}"

  use_detected_hold: !input use_detected_hold
  detected_hold_entities: !input detected_hold_entities
  detected_hold_sensor_control_state: !input detected_hold_sensor_control_state
  detected_hold_type_on: !input detected_hold_type_on
  detected_hold_type_off: !input detected_hold_type_off
  detected_hold_enabled: "{{ use_detected_hold == 'detected_hold_enabled' and detected_hold_entities | length > 0 }}"

  use_cleared_hold: !input use_cleared_hold
  cleared_hold_entities: !input cleared_hold_entities
  cleared_hold_sensor_control_state: !input cleared_hold_sensor_control_state
  cleared_hold_type_on: !input cleared_hold_type_on
  cleared_hold_type_off: !input cleared_hold_type_off
  cleared_hold_enabled: "{{ use_cleared_hold == 'clearing_hold_enabled' and cleared_hold_entities | length > 0 }}"

  # --- Light Control - Illuminance / Sun ---
  use_lux: !input use_lux
  lux_sensor: !input lux_sensor
  lux_low_val: !input lux_low_val
  lux_high_val: !input lux_high_val
  lux_turn_off_when_bright: !input lux_turn_off_when_bright
  use_sun: !input use_sun
  sun_falling: !input sun_falling
  sun_rising: !input sun_rising
  lux_enabled: "{{ use_lux == 'use_lux_enabled' and lux_sensor | length > 0 }}"
  lux_off_enabled: "{{ lux_enabled and lux_turn_off_when_bright }}"
  sun_enabled: "{{ use_sun == 'sun_enabled' }}"

  # --- Timing: every duration input converted to seconds ---
  delay_inputs:
    base_on: !input base_occ_on_delay
    base_off: !input base_occ_off_delay
    grace: !input light_off_grace
    override_timeout: !input override_timeout
    override_clear: !input override_clear_delay
    entering_on: !input entering_delay_on
    entering_off: !input entering_delay_off
    leaving_on: !input leaving_delay_on
    leaving_off: !input leaving_delay_off
    detected_hold_on: !input detected_hold_delay_on
    detected_hold_off: !input detected_hold_delay_off
    cleared_hold_on: !input cleared_hold_delay_on
    cleared_hold_off: !input cleared_hold_delay_off
    rise: !input smart_occ_rising_edge_delay
    fall: !input smart_occ_falling_edge_delay
  delay_secs: >-
    {%- set ns = namespace(pairs=[]) -%}
    {%- for key, d in delay_inputs.items() -%}
      {%- if d is mapping -%}
        {%- set s = d.get('days', 0) | float(0) * 86400 + d.get('hours', 0) | float(0) * 3600
                  + d.get('minutes', 0) | float(0) * 60 + d.get('seconds', 0) | float(0) -%}
      {%- elif d is string and ':' in d -%}
        {%- set p = d.split(':') | map('float', 0) | list -%}
        {%- set s = p[0] * 3600 + p[1] * 60 + (p[2] if p | length > 2 else 0) -%}
      {%- else -%}
        {%- set s = d | float(0) -%}
      {%- endif -%}
      {%- set ns.pairs = ns.pairs + [[key, s]] -%}
    {%- endfor -%}
    {{ dict(ns.pairs) }}
  light_off_grace_secs: "{{ delay_secs.grace }}"
  override_timeout_secs: "{{ delay_secs.override_timeout }}"

  # --- Manual Override ---
  use_manual_override: !input use_manual_override
  manual_override_helper: !input manual_override_helper
  override_entities: !input override_entities
  override_detection: !input override_detection
  override_attribute_changes: !input override_attribute_changes
  override_scope: !input override_scope
  override_reset_modes: !input override_reset_modes
  override_release_action: !input override_release_action
  override_enabled: "{{ use_manual_override == 'override_enabled' and manual_override_helper | length > 0 }}"
  override_attrs: ['brightness', 'color_temp_kelvin', 'color_temp', 'hs_color', 'rgb_color', 'rgbw_color', 'rgbww_color', 'xy_color', 'effect']

  # --- Trigger id groups ---
  resync_ids: ['startup', 'reload', 'automation enabled', 'override released']
  occupancy_ids:
    - base occupancy on
    - base occupancy off
    - entering on
    - entering off
    - leaving on
    - leaving off
    - detected hold on
    - detected hold off
    - clear hold on
    - clear hold off
    - rising delay base
    - rising delay entering
    - rising delay leaving
    - falling delay base
    - falling delay entering
    - falling delay leaving
  # Edge-delay confirmation triggers (fire when an input has held its state for group delay + edge delay)
  rising_delay_ids: ['rising delay base', 'rising delay entering', 'rising delay leaving']
  falling_delay_ids: ['falling delay base', 'falling delay entering', 'falling delay leaving']
  # Which logic group each occupancy trigger belongs to (decides which edges it may drive)
  group_by_trigger:
    rising delay base: base_occ
    rising delay entering: entering
    rising delay leaving: leaving
    falling delay base: base_occ
    falling delay entering: entering
    falling delay leaving: leaving
    base occupancy on: base_occ
    base occupancy off: base_occ
    entering on: entering
    entering off: entering
    leaving on: leaving
    leaving off: leaving
    detected hold on: detected_hold
    detected hold off: detected_hold
    clear hold on: cleared_hold
    clear hold off: cleared_hold
  env_ids: ['sun setting threshold', 'sun rising threshold', 'illuminance low limit', 'illuminance high limit']
  quiet_ids:
    - sun setting threshold
    - sun rising threshold
    - illuminance low limit
    - illuminance high limit
    - light grace expired
    - light grace safety
  grace_ids: ['light grace expired', 'light grace safety']
  transition_ids: ['light control enabled', 'light control disabled', 'automation enabled', 'automation disabled', 'override released']
  override_check_ids: ['override timeout', 'override area clear', 'override safety', 'startup', 'reload']

# Raw inputs for the template safety-net triggers (trigger templates can't read `variables`)
trigger_variables:
  tv_sensor: !input smart_occ_sensor
  tv_helper: !input smart_occ_helper
  tv_base: !input base_occ
  tv_grace: !input light_off_grace
  tv_override_helper: !input manual_override_helper
  tv_override_scope: !input override_scope
  tv_reset_modes: !input override_reset_modes
  tv_override_timeout: !input override_timeout
  tv_override_clear: !input override_clear_delay
  tv_base_on: !input base_occ_on_delay
  tv_base_off: !input base_occ_off_delay
  tv_entering_on: !input entering_delay_on
  tv_entering_off: !input entering_delay_off
  tv_leaving_on: !input leaving_delay_on
  tv_leaving_off: !input leaving_delay_off
  tv_rise: !input smart_occ_rising_edge_delay
  tv_fall: !input smart_occ_falling_edge_delay

# ============================================================================
# TRIGGERS
# Every trigger has an id. All delays use native `for:` timers: they never block
# the run queue and are cancelled automatically when the state flips back.
# `for:` timers do not survive a restart/reload - the `startup` / `reload` resync
# reconciles lights, and two minute-resolution template triggers finish a
# grace period or manual override whose timer was lost.
# ============================================================================
triggers:
  - alias: Home Assistant Started
    trigger: homeassistant
    event: start
    id: startup
  - alias: Automations Reloaded
    trigger: event
    event_type: automation_reloaded
    id: reload

  # --- Base occupancy (optional on/off delay = extended-presence buffer) ---
  - alias: Base Occupancy ON Trigger
    trigger: state
    id: base occupancy on
    entity_id: !input base_occ
    to: "on"
    for: !input base_occ_on_delay
  - alias: Base Occupancy OFF Trigger
    trigger: state
    id: base occupancy off
    entity_id: !input base_occ
    to: "off"
    for: !input base_occ_off_delay

  # --- Automation control ---
  - alias: Automation Control Enabled
    trigger: state
    id: automation enabled
    entity_id: !input automation_control_entity
    from: !input automation_control_state
  - alias: Automation Control Disabled
    trigger: state
    id: automation disabled
    entity_id: !input automation_control_entity
    to: !input automation_control_state

  # --- Entering / Leaving / Holds (with per-entity delays) ---
  - alias: Entering ON (with Delay)
    trigger: state
    id: entering on
    entity_id: !input entering_sensors
    to: !input entering_sensor_control_state
    for: !input entering_delay_on
  - alias: Entering OFF (with Delay)
    trigger: state
    id: entering off
    entity_id: !input entering_sensors
    from: !input entering_sensor_control_state
    for: !input entering_delay_off
  - alias: Leaving ON (with Delay)
    trigger: state
    id: leaving on
    entity_id: !input leaving_sensors
    to: !input leaving_sensor_control_state
    for: !input leaving_delay_on
  - alias: Leaving OFF (with Delay)
    trigger: state
    id: leaving off
    entity_id: !input leaving_sensors
    from: !input leaving_sensor_control_state
    for: !input leaving_delay_off
  - alias: Detected Hold ON (with Delay)
    trigger: state
    id: detected hold on
    entity_id: !input detected_hold_entities
    to: !input detected_hold_sensor_control_state
    for: !input detected_hold_delay_on
  - alias: Detected Hold OFF (with Delay)
    trigger: state
    id: detected hold off
    entity_id: !input detected_hold_entities
    from: !input detected_hold_sensor_control_state
    for: !input detected_hold_delay_off
  - alias: Clear Hold ON (with Delay)
    trigger: state
    id: clear hold on
    entity_id: !input cleared_hold_entities
    to: !input cleared_hold_sensor_control_state
    for: !input cleared_hold_delay_on
  - alias: Clear Hold OFF (with Delay)
    trigger: state
    id: clear hold off
    entity_id: !input cleared_hold_entities
    from: !input cleared_hold_sensor_control_state
    for: !input cleared_hold_delay_off

  # --- Smart occupancy edge delays ---
  # An edge can only become true when one of its inputs changes, so it is due exactly
  # when that input has held its new state for (group delay + edge delay). These
  # triggers wake the run at that moment; the run re-checks that the edge stayed
  # asserted the whole time. With an edge delay of 0 they are ignored.
  - alias: Rising Edge Delay - Base Occupancy
    trigger: state
    id: rising delay base
    entity_id: !input base_occ
    to: "on"
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_base_on, tv_rise] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}
  - alias: Rising Edge Delay - Entering
    trigger: state
    id: rising delay entering
    entity_id: !input entering_sensors
    to: !input entering_sensor_control_state
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_entering_on, tv_rise] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}
  - alias: Rising Edge Delay - Leaving Cleared
    trigger: state
    id: rising delay leaving
    entity_id: !input leaving_sensors
    from: !input leaving_sensor_control_state
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_leaving_off, tv_rise] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}
  - alias: Falling Edge Delay - Base Occupancy
    trigger: state
    id: falling delay base
    entity_id: !input base_occ
    to: "off"
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_base_off, tv_fall] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}
  - alias: Falling Edge Delay - Entering Cleared
    trigger: state
    id: falling delay entering
    entity_id: !input entering_sensors
    from: !input entering_sensor_control_state
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_entering_off, tv_fall] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}
  - alias: Falling Edge Delay - Leaving
    trigger: state
    id: falling delay leaving
    entity_id: !input leaving_sensors
    to: !input leaving_sensor_control_state
    for: >-
      {%- set ns = namespace(s=0) -%}
      {%- for d in [tv_leaving_on, tv_fall] -%}
        {%- set ns.s = ns.s + (d.get('days', 0) | float(0)) * 86400 + (d.get('hours', 0) | float(0)) * 3600
                       + (d.get('minutes', 0) | float(0)) * 60 + (d.get('seconds', 0) | float(0)) if d is mapping else ns.s -%}
      {%- endfor -%}
      {{ ns.s | int }}

  # --- Light control skip ---
  - alias: Light Skip Activated
    trigger: state
    id: light control enabled
    entity_id: !input light_skip_entity
    to: !input light_skip_state
  - alias: Light Skip Released
    trigger: state
    id: light control disabled
    entity_id: !input light_skip_entity
    from: !input light_skip_state

  # --- Environment ---
  - alias: Sun Elevation Below Setting Threshold
    trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: !input sun_falling
    id: sun setting threshold
  - alias: Sun Elevation Above Rising Threshold
    trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: !input sun_rising
    id: sun rising threshold
  - alias: Illuminance Low
    trigger: numeric_state
    entity_id: !input lux_sensor
    below: !input lux_low_val
    id: illuminance low limit
    for: !input lux_low_val_delay
  - alias: Illuminance High
    trigger: numeric_state
    entity_id: !input lux_sensor
    above: !input lux_high_val
    id: illuminance high limit
    for: !input lux_high_val_delay

  # --- Light-off grace period (fires only if smart occupancy STAYS off) ---
  # The run checks the age of the entity that actually stores smart occupancy,
  # so whichever of these fires early is ignored.
  - alias: Light Off Grace Expired (Sensor)
    trigger: state
    id: light grace expired
    entity_id: !input smart_occ_sensor
    to: "off"
    for: !input light_off_grace
  - alias: Light Off Grace Expired (Helper)
    trigger: state
    id: light grace expired
    entity_id: !input smart_occ_helper
    to: "off"
    for: !input light_off_grace
  - alias: Light Off Grace Expired (Base Occupancy, no helper/sensor)
    trigger: state
    id: light grace expired
    entity_id: !input base_occ
    to: "off"
    for: !input light_off_grace
  - alias: Light Off Grace Safety Net (timer lost to restart / reload)
    trigger: template
    id: light grace safety
    value_template: >-
      {%- set e = tv_sensor if (tv_sensor is string and tv_sensor | length > 0)
             else (tv_helper if (tv_helper is string and tv_helper | length > 0) else '') -%}
      {%- set d = tv_grace -%}
      {%- set secs = (d.get('hours', 0) | float(0) * 3600 + d.get('minutes', 0) | float(0) * 60 + d.get('seconds', 0) | float(0)) if d is mapping else 0 -%}
      {{ e | length > 0 and secs > 0 and states[e] is not none and is_state(e, 'off')
         and (now() - states[e].last_changed).total_seconds() >= secs + 60 }}

  # --- Manual override ---
  # No from/to filter so brightness/color changes are seen too; the run filters
  # out unavailable/unknown and attribute noise.
  - alias: Manual Change On Monitored Entity
    trigger: state
    id: manual change
    entity_id: !input override_entities
  - alias: Override Timeout
    trigger: state
    id: override timeout
    entity_id: !input manual_override_helper
    to: "on"
    for: !input override_timeout
  - alias: Override Released
    trigger: state
    id: override released
    entity_id: !input manual_override_helper
    to: "off"
  # Area-clear reset: any of these starting a `for:` timer leads to the same check
  - alias: Override Area Clear (override started while already clear)
    trigger: state
    id: override area clear
    entity_id: !input manual_override_helper
    to: "on"
    for: !input override_clear_delay
  - alias: Override Area Clear (Smart Occupancy Sensor)
    trigger: state
    id: override area clear
    entity_id: !input smart_occ_sensor
    to: "off"
    for: !input override_clear_delay
  - alias: Override Area Clear (Smart Occupancy Helper)
    trigger: state
    id: override area clear
    entity_id: !input smart_occ_helper
    to: "off"
    for: !input override_clear_delay
  - alias: Override Area Clear (Base Occupancy)
    trigger: state
    id: override area clear
    entity_id: !input base_occ
    to: "off"
    for: !input override_clear_delay
  - alias: Override Safety Net (timer lost to restart / reload)
    trigger: template
    id: override safety
    value_template: >-
      {%- set h = tv_override_helper if tv_override_helper is string else '' -%}
      {%- if h | length > 0 and is_state(h, 'on') -%}
        {%- set ns = namespace(to=0, clr=0) -%}
        {%- for d in [tv_override_timeout, tv_override_clear] -%}
          {%- set s = (d.get('hours', 0) | float(0) * 3600 + d.get('minutes', 0) | float(0) * 60 + d.get('seconds', 0) | float(0)) if d is mapping else 0 -%}
          {%- if loop.first -%}{%- set ns.to = s -%}{%- else -%}{%- set ns.clr = s -%}{%- endif -%}
        {%- endfor -%}
        {%- set store = tv_sensor if (tv_sensor is string and tv_sensor | length > 0)
               else (tv_helper if (tv_helper is string and tv_helper | length > 0) else '') -%}
        {%- set area = tv_base if (tv_override_scope == 'all' or store == '') else store -%}
        {%- set h_age = (now() - states[h].last_changed).total_seconds() -%}
        {%- set a_age = (now() - states[area].last_changed).total_seconds() if is_state(area, 'off') else -1 -%}
        {{ ('timeout' in tv_reset_modes and ns.to > 0 and h_age >= ns.to + 60)
           or ('area_clear' in tv_reset_modes and a_age >= ns.clr + 60 and h_age >= ns.clr + 60) }}
      {%- else -%}
        false
      {%- endif -%}

# ============================================================================
# CONDITIONS
# Everything else is decided inside `actions` from fresh state, so the only gate
# here is the automation-control switch.
# ============================================================================
conditions:
  - alias: Automation Control - Enabled
    condition: or
    conditions:
      - alias: Automation control feature is not in use
        condition: template
        value_template: "{{ use_automation_control == 'automation_control_disabled' }}"
      - alias: Control entity is NOT in its disabling state (or none selected)
        condition: template
        value_template: >
          {{ use_automation_control == 'automation_control_enabled' and
             (automation_control_entity | length == 0 or
              not is_state(automation_control_entity, automation_control_state)) }}
      - alias: The disabling transition itself (applies the fallback state)
        condition: trigger
        id: automation disabled

actions:
  # ============================================================================
  # STEP 0: Evaluate everything from FRESH state at run time
  # ============================================================================
  - alias: "Evaluate current conditions"
    variables:
      trig_id: "{{ trigger.id | string }}"
      is_resync: "{{ trig_id in resync_ids }}"
      is_occ_trigger: "{{ is_resync or trig_id in occupancy_ids }}"
      trigger_entity: "{{ trigger.entity_id | default('') }}"
      trig_group: "{{ group_by_trigger.get(trig_id, '') }}"
      now_ts: "{{ as_timestamp(now()) }}"

      # --- Timeline replay: group latches, base occupancy and edge timing ---
      # Rebuilds recent history from each input's last change. Before its last change
      # every input was in the opposite state; a change only counts once its own
      # group delay has elapsed (so all group delays are honoured on EVERY run).
      # Groups are latches: ON when their On-type is met, OFF when their Off-type is
      # met, unchanged when neither is met, and decided by the latest change when
      # both are met. While replaying, it records when each edge last started
      # asserting ON ITS OWN (rising without falling and vice versa) so the
      # smart-occupancy edge delays can be measured.
      timeline: >-
        {%- macro levels(l, bon, bvalid) -%}
          {%- set rs = ('base_occ' in smart_occ_rising_edge) | int + ('entering' in smart_occ_rising_edge and entering_enabled) | int + ('leaving' in smart_occ_rising_edge and leaving_enabled) | int -%}
          {%- set rm = ('base_occ' in smart_occ_rising_edge and bvalid and bon) | int + ('entering' in smart_occ_rising_edge and entering_enabled and l[0]) | int + ('leaving' in smart_occ_rising_edge and leaving_enabled and not l[1]) | int -%}
          {%- set fs = ('base_occ' in smart_occ_falling_edge) | int + ('entering' in smart_occ_falling_edge and entering_enabled) | int + ('leaving' in smart_occ_falling_edge and leaving_enabled) | int -%}
          {%- set fm = ('base_occ' in smart_occ_falling_edge and bvalid and not bon) | int + ('entering' in smart_occ_falling_edge and entering_enabled and not l[0]) | int + ('leaving' in smart_occ_falling_edge and leaving_enabled and l[1]) | int -%}
          {%- set r = rs > 0 and ((smart_occ_rising_edge_type_on == 'any' and rm > 0) or (smart_occ_rising_edge_type_on == 'all' and rm == rs)) -%}
          {%- set f = fs > 0 and ((smart_occ_falling_edge_type_off == 'any' and fm > 0) or (smart_occ_falling_edge_type_off == 'all' and fm == fs)) -%}
          {{- 'T' if r else 'F' -}}{{- 'T' if f else 'F' -}}
        {%- endmacro -%}
        {%- set cfgs = [
          [entering_enabled, entering_sensors, entering_sensor_control_state, entering_type_on, entering_type_off, delay_secs.entering_on, delay_secs.entering_off],
          [leaving_enabled, leaving_sensors, leaving_sensor_control_state, leaving_type_on, leaving_type_off, delay_secs.leaving_on, delay_secs.leaving_off],
          [detected_hold_enabled, detected_hold_entities, detected_hold_sensor_control_state, detected_hold_type_on, detected_hold_type_off, delay_secs.detected_hold_on, delay_secs.detected_hold_off],
          [cleared_hold_enabled, cleared_hold_entities, cleared_hold_sensor_control_state, cleared_hold_type_on, cleared_hold_type_off, delay_secs.cleared_hold_on, delay_secs.cleared_hold_off]
        ] -%}
        {%- set ns = namespace(m=[0, 0, 0, 0], n=[0, 0, 0, 0], latch=[false, false, false, false], events=[],
                               bon=false, bvalid=false, r=false, f=false, ra=false, fa=false, ra_since=0, fa_since=0) -%}
        {#- 1. prior state of every group input + its effective change event -#}
        {%- for c in cfgs -%}
          {%- set i = loop.index0 -%}
          {%- if c[0] -%}
            {%- set ns.n = ns.n[:i] + [c[1] | length] + ns.n[i + 1:] -%}
            {%- for e in c[1] -%}
              {%- set s = states[e] -%}
              {%- if s is not none and s.state in ['on', 'off'] -%}
                {%- set match = s.state == c[2] -%}
                {%- if not match -%}
                  {%- set ns.m = ns.m[:i] + [ns.m[i] + 1] + ns.m[i + 1:] -%}
                {%- endif -%}
                {%- set eff = as_timestamp(s.last_changed) + (c[5] if match else c[6]) -%}
                {%- if eff <= now_ts + 0.5 -%}
                  {%- set ns.events = ns.events + [[eff, i, match]] -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set on_c = (c[3] == 'any' and ns.m[i] > 0) or (c[3] == 'all' and ns.m[i] == ns.n[i]) -%}
            {%- set off_c = (c[4] == 'any' and ns.m[i] < ns.n[i]) or (c[4] == 'all' and ns.m[i] == 0) -%}
            {%- set ns.latch = ns.latch[:i] + [on_c and not off_c] + ns.latch[i + 1:] -%}
          {%- endif -%}
        {%- endfor -%}
        {#- 2. base occupancy (index 4); unavailable counts as neither on nor off -#}
        {%- set bs = states[base_occ] -%}
        {%- if bs is not none and bs.state in ['on', 'off'] -%}
          {%- set ns.bvalid = true -%}
          {%- set ns.bon = bs.state != 'on' -%}
          {%- set beff = as_timestamp(bs.last_changed) + (delay_secs.base_on if bs.state == 'on' else delay_secs.base_off) -%}
          {%- if beff <= now_ts + 0.5 -%}
            {%- set ns.events = ns.events + [[beff, 4, bs.state == 'on']] -%}
          {%- endif -%}
        {%- endif -%}
        {#- 3. replay in time order -#}
        {%- set lv = levels(ns.latch, ns.bon, ns.bvalid) -%}
        {%- set ns.r = lv[0] == 'T' -%}
        {%- set ns.f = lv[1] == 'T' -%}
        {%- set ns.ra = ns.r and not ns.f -%}
        {%- set ns.fa = ns.f and not ns.r -%}
        {%- for ev in ns.events | sort -%}
          {%- set t = ev[0] -%}
          {%- set i = ev[1] -%}
          {%- set match = ev[2] -%}
          {%- if i == 4 -%}
            {%- set ns.bon = match -%}
          {%- else -%}
            {%- set c = cfgs[i] -%}
            {%- set mm = ns.m[i] + (1 if match else -1) -%}
            {%- set ns.m = ns.m[:i] + [mm] + ns.m[i + 1:] -%}
            {%- set on_c = (c[3] == 'any' and mm > 0) or (c[3] == 'all' and mm == ns.n[i]) -%}
            {%- set off_c = (c[4] == 'any' and mm < ns.n[i]) or (c[4] == 'all' and mm == 0) -%}
            {%- set nl = match if (on_c and off_c) else (true if on_c else (false if off_c else ns.latch[i])) -%}
            {%- set ns.latch = ns.latch[:i] + [nl] + ns.latch[i + 1:] -%}
          {%- endif -%}
          {%- set lv = levels(ns.latch, ns.bon, ns.bvalid) -%}
          {%- set ns.r = lv[0] == 'T' -%}
          {%- set ns.f = lv[1] == 'T' -%}
          {%- set ra = ns.r and not ns.f -%}
          {%- set fa = ns.f and not ns.r -%}
          {%- if ra and not ns.ra -%}
            {%- set ns.ra_since = t -%}
          {%- endif -%}
          {%- if fa and not ns.fa -%}
            {%- set ns.fa_since = t -%}
          {%- endif -%}
          {%- set ns.ra = ra -%}
          {%- set ns.fa = fa -%}
        {%- endfor -%}
        {{ {'latch': ns.latch, 'base_on': ns.bvalid and ns.bon, 'base_off': ns.bvalid and not ns.bon,
            'rising': ns.r, 'falling': ns.f, 'rising_since': ns.ra_since, 'falling_since': ns.fa_since} }}

      # Always real booleans, never the string "false"
      entering_is_on: "{{ entering_enabled and timeline.latch[0] }}"
      entering_is_off: "{{ entering_enabled and not timeline.latch[0] }}"
      leaving_is_on: "{{ leaving_enabled and timeline.latch[1] }}"
      leaving_is_off: "{{ leaving_enabled and not timeline.latch[1] }}"
      detected_hold_is_on: "{{ detected_hold_enabled and timeline.latch[2] }}"
      detected_hold_is_off: "{{ detected_hold_enabled and not timeline.latch[2] }}"
      cleared_hold_is_on: "{{ cleared_hold_enabled and timeline.latch[3] }}"
      cleared_hold_is_off: "{{ cleared_hold_enabled and not timeline.latch[3] }}"

      # --- Light skip (OFF is always the strict inverse of ON: no dead zone) ---
      skip_matching: "{{ expand(light_skip_entity) | selectattr('state', 'eq', light_skip_state) | list | length if light_skip_enabled else 0 }}"
      light_skip_is_on: "{{ light_skip_enabled and ((light_skip_type_on == 'any' and skip_matching > 0) or (light_skip_type_on == 'all' and skip_matching == light_skip_entity | length)) }}"
      light_skip_is_off: "{{ light_skip_enabled and not light_skip_is_on }}"

      automation_control_is_disabled: "{{ use_automation_control == 'automation_control_enabled' and automation_control_entity | length > 0 and is_state(automation_control_entity, automation_control_state) }}"

      # --- Base occupancy, honouring its on/off buffers (inside a buffer it counts as its previous state) ---
      base_state: "{{ states(base_occ) }}"
      base_on_settled: "{{ timeline.base_on }}"
      base_off_settled: "{{ timeline.base_off }}"

      # --- Current smart occupancy state (the controller's memory) ---
      any_switchable_on: "{{ switchable_entities | select('is_state', 'on') | list | length > 0 }}"
      current_state: >-
        {%- if not stateless -%}
          {{ states(storage_entity) }}
        {%- elif switchable_entities | length > 0 -%}
          {{ 'on' if any_switchable_on else 'off' }}
        {%- elif trig_id in ['base occupancy on', 'rising delay base'] -%}
          off
        {%- elif trig_id in ['base occupancy off', 'falling delay base'] -%}
          on
        {%- else -%}
          {{ base_state }}
        {%- endif -%}
      # Safe reference when the stored state is unknown/unavailable (restart)
      prev_state: "{{ current_state if current_state in ['on', 'off'] else ('on' if base_on_settled else 'off') }}"

      # Edges are only (re)evaluated when a group selected for EITHER edge changed, a hold
      # changed, or on resync. Groups not selected for an edge never count toward it.
      edges_valid: >-
        {{ is_resync or trig_group in smart_occ_rising_edge or trig_group in smart_occ_falling_edge
           or trig_group in ['detected_hold', 'cleared_hold'] }}

      # --- Edge levels and delays ---
      # An edge "asserts" only while it is true on its own; a conflict (both true) keeps the
      # current state and restarts both delays. A delayed edge acts once it has asserted for
      # the full delay - the matching 'rising/falling delay' trigger wakes the run on time.
      rising_asserting: "{{ timeline.rising and not timeline.falling }}"
      falling_asserting: "{{ timeline.falling and not timeline.rising }}"
      rising_ready: "{{ rising_asserting and (delay_secs.rise == 0 or now_ts - timeline.rising_since >= delay_secs.rise - 0.5) }}"
      falling_ready: "{{ falling_asserting and (delay_secs.fall == 0 or now_ts - timeline.falling_since >= delay_secs.fall - 0.5) }}"
      smart_occ_rising_edge_should_turn_on: "{{ edges_valid and rising_ready }}"
      smart_occ_falling_edge_should_turn_off: "{{ edges_valid and falling_ready }}"
      # Waiting out an edge delay (useful for scripts, e.g. dim before the area clears)
      detect_pending: "{{ rising_asserting and not rising_ready and prev_state == 'off' }}"
      clear_pending: "{{ falling_asserting and not falling_ready and prev_state == 'on' }}"

  - alias: "Calculate smart occupancy"
    variables:
      calc_raw: >-
        {#- Priority 1: automation control override / fallback state -#}
        {%- if automation_control_is_disabled -%}
          {{ fallback_state_sensor if fallback_state_sensor in ['on', 'off'] else 'off' }}
        {#- Priority 2: both holds active - resolve by priority setting (first = keep current) -#}
        {%- elif detected_hold_is_on and cleared_hold_is_on -%}
          {{ 'on' if smart_occ_hold_priority == 'detected' else ('off' if smart_occ_hold_priority == 'cleared' else prev_state) }}
        {#- Priority 3: single hold that triggers -#}
        {%- elif detected_hold_is_on and smart_occ_detected_hold_rising_edge == 'trigger_and_hold' -%}
          on
        {%- elif cleared_hold_is_on and smart_occ_cleared_hold_falling_edge == 'trigger_and_hold' -%}
          off
        {#- Priority 4: gated edge logic - only an edge asserting alone, after its delay (holds can veto) -#}
        {%- elif smart_occ_rising_edge_should_turn_on and not cleared_hold_is_on -%}
          on
        {%- elif smart_occ_falling_edge_should_turn_off and not detected_hold_is_on -%}
          off
        {#- Priority 5: no edge, or both edges - keep current state -#}
        {%- else -%}
          {{ prev_state }}
        {%- endif -%}
      calc_smart_occ: "{{ calc_raw | trim }}"
      # The template sensor may be told "unavailable"; the helper/lights only ever see on/off
      sensor_state: "{{ 'unavailable' if automation_control_is_disabled and fallback_state_sensor == 'unavailable' else calc_smart_occ }}"
      state_changed: "{{ current_state != calc_smart_occ }}"

  # ============================================================================
  # STEP 1: Environment, override and light decision
  # ============================================================================
  - alias: "Decide light command"
    variables:
      # --- Manual override ---
      override_active: "{{ override_enabled and is_state(manual_override_helper, 'on') }}"
      override_frozen: "{{ override_active and trig_id != 'override released' }}"
      helper_age: "{{ (now_ts - as_timestamp(states[manual_override_helper].last_changed)) if override_active else 0 }}"
      area_clear_entity: "{{ base_occ if (stateless or override_scope == 'all') else storage_entity }}"
      area_clear_age: "{{ (now_ts - as_timestamp(states[area_clear_entity].last_changed)) if is_state(area_clear_entity, 'off') else -1 }}"
      override_timeout_due: "{{ 'timeout' in override_reset_modes and override_timeout_secs > 0 and helper_age >= override_timeout_secs - 0.5 }}"
      override_clear_due: "{{ 'area_clear' in override_reset_modes and area_clear_age >= delay_secs.override_clear - 0.5 and helper_age >= delay_secs.override_clear - 0.5 }}"
      is_manual_change: >-
        {%- set f = trigger.from_state if trig_id == 'manual change' else none -%}
        {%- set t = trigger.to_state if trig_id == 'manual change' else none -%}
        {%- set bad = ['unavailable', 'unknown'] -%}
        {%- if f is none or t is none or f.state in bad or t.state in bad -%}
          false
        {%- else -%}
          {%- set ns = namespace(attr=false, own=[]) -%}
          {%- if override_attribute_changes and f.state == 'on' and t.state == 'on' -%}
            {%- for a in override_attrs -%}
              {%- if f.attributes.get(a) != t.attributes.get(a) -%}
                {%- set ns.attr = true -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set c = t.context -%}
          {%- if f.state == t.state and not ns.attr -%}
            false
          {%- elif override_detection == 'user_only' -%}
            {{ c.user_id is not none }}
          {%- elif override_detection == 'not_this' -%}
            {#- Our commands carry the context of one of our runs, whose parent is the
                context of the state change that triggered it -#}
            {%- set tc = this.context if (this is defined and this is not none and this.context is defined) else none -%}
            {%- if tc is not none -%}
              {%- set ns.own = [tc.id, tc.parent_id] -%}
            {%- endif -%}
            {%- set watched = [base_occ, 'sun.sun'] + entering_sensors + leaving_sensors + detected_hold_entities
                              + cleared_hold_entities + light_skip_entity
                              + ([storage_entity] if storage_entity | length > 0 else [])
                              + ([manual_override_helper] if manual_override_helper | length > 0 else [])
                              + ([lux_sensor] if lux_sensor | length > 0 else [])
                              + ([automation_control_entity] if automation_control_entity | length > 0 else []) -%}
            {%- for e in watched -%}
              {%- if states[e] is not none -%}
                {%- set ns.own = ns.own + [states[e].context.id] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set own = ns.own | reject('none') | list -%}
            {{ c.id not in own and (c.parent_id is none or c.parent_id not in own) }}
          {%- else -%}
            {{ c.parent_id is none }}
          {%- endif -%}
        {%- endif -%}

      # --- Environment (sun / lux) ---
      sun_elev: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
      sun_rising_now: "{{ is_state_attr('sun.sun', 'rising', true) }}"
      lux_val: "{{ states(lux_sensor) | float(none) if lux_enabled else none }}"
      sun_dark: "{{ (sun_elev < sun_rising | float(90)) if sun_rising_now else (sun_elev < sun_falling | float(90)) }}"
      sun_bright: "{{ (sun_elev > sun_rising | float(90)) if sun_rising_now else (sun_elev > sun_falling | float(90)) }}"
      lux_dark: "{{ lux_val is none or lux_val < lux_low_val | float(0) }}"
      lux_bright: "{{ lux_val is not none and lux_val > lux_high_val | float(0) }}"
      env_allows_on: "{{ (not sun_enabled or sun_dark) and (not lux_enabled or lux_dark) }}"
      # Lux only counts toward turning lights OFF when explicitly enabled (avoids the lights-raise-lux loop)
      env_too_bright: "{{ (sun_enabled or lux_off_enabled) and (not sun_enabled or sun_bright) and (not lux_off_enabled or lux_bright) }}"

      # --- Light-off grace period, measured on the entity that stores smart occupancy ---
      grace_entity: "{{ base_occ if stateless else storage_entity }}"
      grace_age: "{{ (now_ts - as_timestamp(states[grace_entity].last_changed)) if (states[grace_entity] is not none and is_state(grace_entity, 'off')) else -1 }}"
      grace_elapsed: "{{ light_off_grace_secs == 0 or grace_age >= light_off_grace_secs - 0.5 }}"
      # The safety-net trigger only acts if no run happened since the grace period ended
      grace_already_handled: >-
        {%- set lt = this.attributes.last_triggered if (this is defined and this is not none) else none -%}
        {{ lt is not none and grace_age >= 0 and as_timestamp(lt) >= now_ts - grace_age + light_off_grace_secs - 1 }}
      grace_due: >-
        {{ light_off_grace_secs > 0 and calc_smart_occ == 'off' and (stateless or current_state == 'off') and grace_elapsed
           and (trig_id != 'light grace safety' or any_switchable_on or not grace_already_handled) }}

      # --- Light skip transitions apply their configured state ---
      skip_apply_state: >-
        {%- if trig_id == 'light control enabled' and light_skip_is_on and light_skip_triggered_on_state != 'current' -%}
          {{ calc_smart_occ if light_skip_triggered_on_state == 'smart_occ' else light_skip_triggered_on_state }}
        {%- elif trig_id == 'light control disabled' and light_skip_is_off and light_skip_triggered_off_state != 'current' -%}
          {{ calc_smart_occ if light_skip_triggered_off_state == 'smart_occ' else light_skip_triggered_off_state }}
        {%- else -%}
          none
        {%- endif -%}

      light_cmd_raw: >-
        {%- if trig_id == 'automation disabled' -%}
          none
        {%- elif skip_apply_state in ['on', 'off'] and not override_frozen -%}
          {{ 'on' if (skip_apply_state == 'on' and env_allows_on) else ('off' if skip_apply_state == 'off' else 'none') }}
        {%- elif override_frozen or light_skip_is_on -%}
          none
        {%- elif (trig_id == 'sun setting threshold' and sun_enabled) or (trig_id == 'illuminance low limit' and lux_enabled) -%}
          {{ 'on' if (calc_smart_occ == 'on' and env_allows_on and not any_switchable_on) else 'none' }}
        {%- elif (trig_id == 'sun rising threshold' and sun_enabled) or (trig_id == 'illuminance high limit' and lux_off_enabled) -%}
          {{ 'off' if (calc_smart_occ == 'on' and env_too_bright) else 'none' }}
        {%- elif trig_id in env_ids -%}
          none
        {%- elif trig_id in grace_ids -%}
          {{ 'off' if grace_due else 'none' }}
        {%- elif trig_id == 'override released' -%}
          {%- if override_release_action != 'sync' -%}
            none
          {%- elif calc_smart_occ == 'on' -%}
            {{ 'on' if env_allows_on else 'none' }}
          {%- else -%}
            off
          {%- endif -%}
        {%- elif is_resync -%}
          {#- Startup / reload / re-enable: reconcile with the real light state -#}
          {%- if calc_smart_occ == 'on' -%}
            {{ 'on' if (env_allows_on and (state_changed or (switchable_entities | length > 0 and not any_switchable_on))) else 'none' }}
          {%- else -%}
            {{ 'off' if (grace_elapsed and (state_changed or any_switchable_on)) else 'none' }}
          {%- endif -%}
        {%- elif state_changed and calc_smart_occ == 'on' -%}
          {{ 'on' if env_allows_on else 'none' }}
        {%- elif state_changed and calc_smart_occ == 'off' -%}
          {{ 'off' if light_off_grace_secs == 0 else 'none' }}
        {%- else -%}
          none
        {%- endif -%}
      light_cmd: "{{ light_cmd_raw | trim }}"
      active_script_entities: "{{ script_entities if light_cmd == 'on' else off_script_entities }}"
      lighting_script_ok: "{{ lighting_script | length > 0 and states(lighting_script) not in ['unknown', 'unavailable'] }}"

      # Payload handed to every script (light_target scripts + secondary script)
      script_payload:
        smart_occupancy_state: "{{ calc_smart_occ }}"
        previous_state: "{{ current_state }}"
        state_changed: "{{ state_changed }}"
        occupancy_event: "{{ ('detected' if calc_smart_occ == 'on' else 'cleared') if state_changed else 'none' }}"
        smart_occupancy_rising_trigger: "{{ smart_occ_rising_edge_should_turn_on }}"
        smart_occupancy_falling_trigger: "{{ smart_occ_falling_edge_should_turn_off }}"
        detect_pending: "{{ detect_pending }}"
        clear_pending: "{{ clear_pending }}"
        base_occupancy_state: "{{ base_state }}"
        entering_is_on: "{{ entering_is_on }}"
        entering_is_off: "{{ entering_is_off }}"
        leaving_is_on: "{{ leaving_is_on }}"
        leaving_is_off: "{{ leaving_is_off }}"
        detected_hold_is_on: "{{ detected_hold_is_on }}"
        detected_hold_is_off: "{{ detected_hold_is_off }}"
        cleared_hold_is_on: "{{ cleared_hold_is_on }}"
        cleared_hold_is_off: "{{ cleared_hold_is_off }}"
        light_skip_is_on: "{{ light_skip_is_on }}"
        light_skip_event: "{{ 'activated' if trig_id == 'light control enabled' else ('released' if trig_id == 'light control disabled' else 'none') }}"
        light_command: "{{ light_cmd }}"
        light_turn_on: "{{ light_cmd == 'on' }}"
        light_turn_off: "{{ light_cmd == 'off' }}"
        grace_pending: "{{ light_off_grace_secs > 0 and calc_smart_occ == 'off' and light_cmd != 'off' and not grace_elapsed }}"
        automation_control_is_disabled: "{{ automation_control_is_disabled }}"
        manual_override_is_on: "{{ override_active }}"
        override_event: "{{ 'released' if trig_id == 'override released' else 'none' }}"
        env_allows_on: "{{ env_allows_on }}"
        env_too_bright: "{{ env_too_bright }}"
        illuminance: "{{ lux_val }}"
        sun_elevation: "{{ sun_elev }}"
        last_triggered_by: "{{ trig_id }}"
        trigger_entity: "{{ trigger_entity }}"
      script_data: "{{ script_payload | combine({final_field_name: calc_smart_occ}) }}"

  # ============================================================================
  # STEP 2: Manual override housekeeping (each branch ends the run)
  # ============================================================================
  - alias: "Manual override housekeeping"
    choose:
      - alias: "Manual change detected -> start override"
        conditions:
          - "{{ trig_id == 'manual change' }}"
        sequence:
          - if:
              - "{{ override_enabled and is_manual_change and not override_active }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ manual_override_helper }}"
              - if:
                  - "{{ lighting_script_ok }}"
                then:
                  - action: script.turn_on
                    target:
                      entity_id: "{{ lighting_script }}"
                    data:
                      variables: >-
                        {{ script_data | combine({'manual_override_is_on': true, 'override_event': 'started',
                           'light_command': 'none', 'light_turn_on': false, 'light_turn_off': false,
                           'trigger_entity': trigger_entity}) }}
                    continue_on_error: true
          - stop: "Manual change handled"

      - alias: "Override reset due (timeout / area clear / lost timer)"
        conditions:
          - "{{ trig_id in override_check_ids and override_active and (override_timeout_due or override_clear_due) }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ manual_override_helper }}"
          # the 'override released' trigger performs the full resync
          - stop: "Override released"

      - alias: "Override check that is not due yet"
        conditions:
          - "{{ trig_id in ['override timeout', 'override area clear', 'override safety'] }}"
        sequence:
          - stop: "Override check - nothing to do"

      - alias: "Edge-delay trigger while that edge has no delay (the normal trigger already ran)"
        conditions:
          - "{{ (trig_id in rising_delay_ids and delay_secs.rise == 0) or (trig_id in falling_delay_ids and delay_secs.fall == 0) }}"
        sequence:
          - stop: "No edge delay configured"

      - alias: "Grace trigger that no longer applies"
        conditions:
          - "{{ trig_id in grace_ids and light_cmd != 'off' }}"
        sequence:
          - stop: "Nothing to do"

  # Freeze-all mode: occupancy tracking is paused too (resyncs still allowed)
  - alias: "Override freeze-all"
    if:
      - "{{ override_frozen and override_scope == 'all' and trig_id not in ['automation enabled', 'automation disabled', 'startup', 'reload'] }}"
    then:
      - stop: "Manual override active - automation frozen"

  # ============================================================================
  # STEP 3: Publish smart occupancy state (template sensor + helper)
  # ============================================================================
  - alias: "Publish smart occupancy"
    if:
      - "{{ smart_occ_sensor | length > 0 and trig_id not in quiet_ids }}"
    then:
      - event: smart_occupancy_update
        event_data:
          target_sensor: "{{ smart_occ_sensor }}"
          state: "{{ sensor_state }}"
          smart_occupancy_rising_trigger: "{{ smart_occ_rising_edge_should_turn_on }}"
          smart_occupancy_falling_trigger: "{{ smart_occ_falling_edge_should_turn_off }}"
          base_occupancy_state: "{{ base_state }}"
          entering_is_on: "{{ entering_is_on }}"
          entering_is_off: "{{ entering_is_off }}"
          leaving_is_on: "{{ leaving_is_on }}"
          leaving_is_off: "{{ leaving_is_off }}"
          detected_hold_is_on: "{{ detected_hold_is_on }}"
          detected_hold_is_off: "{{ detected_hold_is_off }}"
          cleared_hold_is_on: "{{ cleared_hold_is_on }}"
          cleared_hold_is_off: "{{ cleared_hold_is_off }}"
          light_skip_is_on: "{{ light_skip_is_on }}"
          light_turn_on: "{{ light_cmd == 'on' }}"
          light_turn_off: "{{ light_cmd == 'off' }}"
          automation_control_is_disabled: "{{ automation_control_is_disabled }}"
          manual_override_is_on: "{{ override_active }}"
          last_triggered_by: "{{ trig_id }}"
      # Let the template sensor catch up so a queued follow-up run reads fresh state.
      # Returns immediately when already true; never blocks longer than 2 seconds.
      - wait_template: "{{ states(smart_occ_sensor) == sensor_state }}"
        timeout: 2
        continue_on_timeout: true

  - alias: "Update smart occupancy helper"
    if:
      - "{{ smart_occ_helper | length > 0 }}"
      - "{{ calc_smart_occ in ['on', 'off'] and not is_state(smart_occ_helper, calc_smart_occ) }}"
    then:
      - action: "input_boolean.turn_{{ calc_smart_occ }}"
        target:
          entity_id: "{{ smart_occ_helper }}"

  # ============================================================================
  # STEP 4: Built-in light control (one apply block for every code path)
  # ============================================================================
  - alias: "Apply light command"
    if:
      - "{{ light_cmd in ['on', 'off'] }}"
    then:
      - if:
          - "{{ light_entities | length > 0 }}"
        then:
          - action: "light.turn_{{ light_cmd }}"
            target:
              entity_id: "{{ light_entities }}"
      - if:
          - "{{ switch_entities | length > 0 }}"
        then:
          - action: "switch.turn_{{ light_cmd }}"
            target:
              entity_id: "{{ switch_entities }}"
      - if:
          - "{{ (scene_entities if light_cmd == 'on' else off_scene_entities) | length > 0 }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: "{{ scene_entities if light_cmd == 'on' else off_scene_entities }}"
      # Scripts selected in the light target: non-blocking so the queue keeps moving
      - if:
          - "{{ active_script_entities | length > 0 }}"
        then:
          - action: script.turn_on
            target:
              entity_id: "{{ active_script_entities }}"
            data:
              variables: "{{ script_data }}"
            continue_on_error: true

  # ============================================================================
  # STEP 5: Optional secondary lighting script - acts like one more light with a
  #         richer command. Skipped silently when unset or missing. During an
  #         override / light skip it still gets context, with light_turn_* false.
  # ============================================================================
  - alias: "Delegate to secondary lighting script"
    if:
      - "{{ lighting_script_ok }}"
      - "{{ state_changed or light_cmd != 'none' or is_occ_trigger or trig_id in transition_ids }}"
    then:
      - action: script.turn_on
        target:
          entity_id: "{{ lighting_script }}"
        data:
          variables: "{{ script_data }}"
        continue_on_error: true

# queued: every state change is processed in order; no step above blocks, so the
# queue drains immediately. All delays are `for:` triggers, not run-time waits.
mode: queued
max: 50
max_exceeded: warning

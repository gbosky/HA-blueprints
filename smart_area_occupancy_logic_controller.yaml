blueprint:
  name: "Smart Area Occupancy 💠"
  description: |
    **Version: 2.0.0**

    This blueprint provides both a flexible and robust way to manage occupancy detection in an area that can have multiple sensors.
    You can simply just provide a single occupancy sensor and a light and the automation will take care of the rest.
    From there you can add additional sensors for entering/leaving zones, holding area detections or cleared states, delays, and more 
    to ensure occupancy of an area is always able to follow the logic you want using other sensors.


    <details>
    <summary><b>📖 Full Documentation</b></summary>


    ## 🎯 Key Features

    - **Multi-Sensor Occupancy Logic** - Combine a single base occupancy sensor with entering/leaving sensors to create smarter area occupancy logic

    - **Occupancy Holds** - Lock occupancy in detected or cleared states independent of a single sensor

    - **Flexible Detection Types** - Choose ANY/ALL conditions for groups of sensors to determine exactly when entering/leaving/hold conditions cause smart area occupancy state changes

    - **Disable Safeguards** - Pause automation entirely with fallback states or disable light control only, so a single automation can maintain area occupancy and/or light control

    - **State Tracking** - Optional Boolean helper and Template Sensor for monitoring "smart" occupancy state outside of the automation

    - **Template Sensor Integration** - Push occupancy state to custom sensor via event in case you want to build your own binary sensor, with optional attributes to track which conditions are active and caused the current state of smart area occupancy

    - **Light Control** - Built-in simple light on/off control to follow logical calculated smart occupancy state, with sun elevation and illuminance thresholds

    - **Manual Override** - Pause light control when lights are changed by hand, with room-tunable reset buffers

    - **Timing Control** - Base occupancy on/off buffers and a light-off grace period, all using non-blocking timers

    - **Advanced Scripts** - If using a script for light control, you can provide separate off scripts or use field keys to determine how to handle light control based on smart area occupancy state or any of its contributing attributes.


    ## 📊 Occupancy State Priority

    When determining Smart Occupancy state, the automation evaluates conditions as a prioritized, gated state machine:

    1. **Automation Control Override (Highest Priority)**  
      If automation control is enabled and the configured control entity matches the defined state →  
      **Smart Occupancy is forced OFF/Fallback State if provided.**  
      No further evaluation occurs.

    2. **Hold Logic (Trigger & Hold Overrides)**  
      If a hold condition is active and configured as `trigger_and_hold`:
      - **Detected Hold Rising Edge** → Force **ON**
      - **Cleared Hold Falling Edge** → Force **OFF**  

      Regardless if hold configured as `hold` or `trigger_and_hold`, if the hold states are active they will override all edge logic and must be cleared before normal evaluation resumes.

    3. **Rising / Falling Edge Evaluation (Gated Edge Engine)**
      Rising and falling selections are evaluated independently using configured `ANY` or `ALL` logic.
      Only the selections you checked (`base_occ`, `entering`, `leaving`) are counted, and an edge is only
      evaluated when one of its selected groups changed (holds changing and startup/reload re-check too).
      Anything you left unchecked can never cause that edge - e.g. with only Entering selected for the rising
      edge, the base sensor seeing a pet or moving blinds will never turn the area on.

      A state transition is allowed only when one edge **asserts alone**:

      ```
      rising_asserting  = rising_result and not falling_result
      falling_asserting = falling_result and not rising_result
      ```

      - If only one edge evaluates true → Apply that transition (after its edge delay, see below).
      - If both edges evaluate true OR both evaluate false → No transition occurs, the current state is kept

      **Edge delays** (Rising Edge Delay / Falling Edge Delay) make an edge wait until it has asserted alone
      for that long. They act on the combined edge, not on one sensor - e.g. with Entering-only rising, the
      rising delay counts from when the entering zone becomes active. A conflict, or the edge dropping, restarts
      the delay. They add on top of the per-group and base occupancy delays.

    4. **Conflict / No Change (Latched State Preservation)**
      If both edges evaluate true, or neither does → **the current Smart Occupancy state is kept**
      (whatever happened first stays true until only the opposite edge asserts).


    ### 🧠 Behavioral Model

    - Smart Occupancy does **not directly mirror the base occupancy sensor**.
    - Base occupancy participates only as a selectable condition within edge evaluation.
    - State transitions occur only when its logic determines its only a rising edge or falling edge. Both cant be true.
    - The system behaves as a deterministic, priority-driven state machine with built-in conflict protection.

    ### 🔁 Group On/Off Types (Hysteresis)

    Every group (entering, leaving, detected hold, cleared hold) is a latch:

    - It turns **on** when its *On Trigger* type (Any/All matching) is met and **off** when its *Off Trigger* type (Any/All not matching) is met.
    - When neither is met (e.g. On = All, Off = All and only some sensors match) the group **keeps its last state**.
    - When both are met (On = Any, Off = Any) the **most recent sensor change** decides.
    - Each group's on/off delays are honoured on every run, not only when that group's own trigger fires.

    ### 💾 Without a Helper or Template Sensor

    Both are optional. Without them the controller uses the controlled lights/switches as its memory
    (lights on = occupied). If only scenes/scripts are targeted it falls back to the base occupancy sensor.
    For advanced setups (holds, entering-only rising edges) a Boolean helper is recommended.

    ## 🚪 Occupancy Detection Types

    | Zone Type | Purpose | Logic |
    |-----------|---------|-------|
    | **Base Occupancy** | Foundation sensor (required) | Motion detector, presence sensor, etc. |
    | **Entering Zone** | Triggers detected state | Entry-path mmWave zones, door sensors, etc. |
    | **Leaving Zone** | Opposite of entering - triggers cleared state | Garage door, back gate, away sensors, etc. |
    | **Detected Hold** | Locks occupancy ON | Important activity sensors, helpers, etc. |
    | **Cleared Hold** | Locks occupancy OFF | Away mode, sleep mode, guests, do-not-disturb, etc. |


    ## 💡 Light Control

    Before executing any light actions, the automation evaluates a set of gating conditions.  
    Lights will only respond when all applicable conditions below are satisfied:

    - **Smart Occupancy State** — Light control follows the calculated Smart Occupancy result from this automation.

    - **Light Control Skip (Optional)** — If a skip/disable entity is provided and active, light control is bypassed while Smart Occupancy logic continues to run.

    - **Illuminance Threshold (Optional)** — If configured, lights will only turn on when measured illuminance is below the low threshold.
      Turning lights *off* when it gets bright is a separate opt-in, because a sensor that sees the lights it controls would loop on/off.

    - **Sun Elevation Threshold (Optional)** — If enabled, lights will only turn on when the sun elevation is below the configured value.

    These conditions act as environmental and manual safeguards to prevent unnecessary light activation while preserving Smart Occupancy state tracking.


    ## 🧩 Script Integration (Advanced Light Control)

    Instead of using built-in light actions, you may provide one or more scripts to handle light control or other logic externally.

    When scripts are configured, this automation will call each script and optionally pass structured data representing the full Smart Occupancy state.


    ### 🔑 Script Field Key

    If **Script Field Key – Smart Occupancy State** is provided:

    - The value of Smart Occupancy (`on` / `off`) will be passed to the script using the specified field name.
    - The field name must match a defined field inside your script.

    Example:

    If your script defines:

    ```
    fields:
      smart_occupancy:
        description: Smart occupancy state
    ```

    Then set:

    ```
    script_field_key: smart_occupancy
    ```

    The script will receive:

    ```
    smart_occupancy: "on"   (or "off")
    ```

    If left empty the state is passed under the field name `state`. The diagnostic data below is always included.
    The key applies to scripts in the light target and to the Secondary Lighting Script.

    ---


    ### 📦 Data Passed to Scripts

    Each script call includes the following data:

    - `smart_occupancy_state` → Final calculated Smart Occupancy state (`on` / `off`)
    - `previous_state` / `state_changed` → State before this run and whether it changed
    - `occupancy_event` → `detected` / `cleared` when the state just changed, otherwise `none`
    - `light_turn_on` / `light_turn_off` / `light_command` → What a light would be told to do (`on` / `off` / `none`)
    - `smart_occupancy_rising_trigger` → Result of rising edge evaluation (true/false)
    - `smart_occupancy_falling_trigger` → Result of falling edge evaluation (true/false)
    - `detect_pending` / `clear_pending` → An edge is asserting but its edge delay is still running (true/false)
    - `base_occupancy_state` → Current state of base occupancy sensor (`on` / `off`)
    - `entering_is_on` / `entering_is_off` (true/false)
    - `leaving_is_on` / `leaving_is_off` (true/false)
    - `detected_hold_is_on` / `detected_hold_is_off` (true/false)
    - `cleared_hold_is_on` / `cleared_hold_is_off` (true/false)
    - `light_skip_is_on` / `light_skip_event` (`activated` / `released` / `none`)
    - `manual_override_is_on` / `override_event` (`started` / `released` / `none`)
    - `automation_control_is_disabled` (true/false)
    - `env_allows_on` / `env_too_bright` / `illuminance` / `sun_elevation` → Environment data
    - `grace_pending` → Occupancy cleared but the light-off grace period is still running
    - `last_triggered_by` / `trigger_entity` → Trigger ID and entity that caused the run

    This allows your script to make advanced decisions based on:

    - Why occupancy changed
    - Which condition asserted
    - Whether the transition was rising or falling
    - Whether a hold was active

    ---

    ### 🧠 How This Enables Advanced Logic

    Because full evaluation data is passed to the script, you can:

    - Use one script for both ON and OFF handling
    - Branch inside the script based on Smart Occupancy state
    - React differently to rising vs falling transitions
    - Override behavior when specific holds are active
    - Build complex scene or lighting behavior outside the blueprint

    This design keeps the Smart Occupancy engine separate from action logic, making the blueprint modular and extensible.


    ## ✋ Manual Override

    If a controlled light/switch is changed by hand (wall switch, dashboard, voice) the automation steps aside.

    - **Detection** - on/off changes (and optionally brightness/color changes) on the *Monitored Entities*. Choose what counts:
      any non-automation change, dashboard/app/voice only, or anything not made by *this* automation (also counts smart buttons/remotes run by other automations).
    - **While active** - light commands are frozen (occupancy still tracks), or the whole automation is frozen, per your setting.
    - **Reset** - automatically, using one or both of:
      - **Area clear** - smart occupancy has been *off* for the **Area Clear Buffer**. The buffer is the grace time that stops a brief mis-detection in an occupied room from cancelling your override. Set it per room.
      - **Timeout** - a hard limit since the override started (0 disables).
    - **On release** - lights re-sync to the current smart occupancy state, or are left alone.
    - Requires an **Override Helper** (`input_boolean`) so the state survives restarts.

    ## ⏱️ Timing

    All delays use native `for:` timers, so they never block the run queue and cancel themselves when the state flips back.

    - **Base Occupancy ON / OFF delay** - extended-presence buffer for the base sensor only.
    - **Rising / Falling Edge Delay** (Logic Controls) - delays the smart occupancy state itself: detected
      only after the rising edge held for this long, cleared only after the falling edge held for this long.
      Scripts get `detect_pending` / `clear_pending` while a delay is running (e.g. dim lights before clearing).
    - **Light Off Grace Period** - occupancy clears immediately, but lights stay on until it has stayed clear for this long.
    - Entering / Leaving / Hold groups keep their own on/off delays, honoured on every run.
    - `for:` timers do not survive a restart or reload. The startup/reload resync reconciles lights with the
      real state, and minute-resolution safety triggers finish a light-off grace period or a manual override that was pending.

    ## 🕹️ Secondary Lighting Script

    An optional **Lighting Script** acts like one more light that receives a richer command. It is called (non-blocking)
    whenever occupancy, lights, skip, override or automation-control state changes, and on occupancy sensor activity.
    Use `light_turn_on` / `light_turn_off` to act like a light; everything else is extra context.
    It works alongside any lights in the light target. Leave it empty to skip it. A missing or broken script never raises an error.
    The *Smart Area Occupancy - Lighting Script* companion blueprint is made for this input.


    ## 🎛️ Template Sensor Configuration


    Optionally, this automation can push events to a custom sensor to monitor the state of the automation.
    The event is sent on every occupancy-related run, so attributes stay current.

    The following is an example configured template sensor in configuration.yaml (only `name` and `unique_id` need changing):

    ```yaml
    template:
      - triggers:
          - trigger: event
            event_type: smart_occupancy_update
        binary_sensor:
          - name: "Smart Occupancy Test"
            unique_id: smart_area_occupancy_test
            device_class: occupancy
            state: >
              {% if trigger.event.data.target_sensor == this.entity_id %}
                {{ trigger.event.data.state if trigger.event.data.state in ['on', 'off'] else 'off' }}
              {% else %}
                {{ states(this.entity_id) }}
              {% endif %}
            availability: >
              {% if trigger.event.data.target_sensor == this.entity_id %}
                {{ trigger.event.data.state in ['on', 'off'] }}
              {% else %}
                {{ has_value(this.entity_id) }}
              {% endif %}
            attributes:
              smart_occupancy_rising_trigger: "{{ trigger.event.data.smart_occupancy_rising_trigger if trigger.event.data.target_sensor == this.entity_id else this.attributes.smart_occupancy_rising_trigger | default(none) }}"
              smart_occupancy_falling_trigger: "{{ trigger.event.data.smart_occupancy_falling_trigger if trigger.event.data.target_sensor == this.entity_id else this.attributes.smart_occupancy_falling_trigger | default(none) }}"
              base_occupancy_state: "{{ trigger.event.data.base_occupancy_state if trigger.event.data.target_sensor == this.entity_id else this.attributes.base_occupancy_state | default(none) }}"
              entering_is_on: "{{ trigger.event.data.entering_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.entering_is_on | default(none) }}"
              entering_is_off: "{{ trigger.event.data.entering_is_off if trigger.event.data.target_sensor == this.entity_id else this.attributes.entering_is_off | default(none) }}"
              leaving_is_on: "{{ trigger.event.data.leaving_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.leaving_is_on | default(none) }}"
              leaving_is_off: "{{ trigger.event.data.leaving_is_off if trigger.event.data.target_sensor == this.entity_id else this.attributes.leaving_is_off | default(none) }}"
              detected_hold_is_on: "{{ trigger.event.data.detected_hold_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.detected_hold_is_on | default(none) }}"
              detected_hold_is_off: "{{ trigger.event.data.detected_hold_is_off if trigger.event.data.target_sensor == this.entity_id else this.attributes.detected_hold_is_off | default(none) }}"
              cleared_hold_is_on: "{{ trigger.event.data.cleared_hold_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.cleared_hold_is_on | default(none) }}"
              cleared_hold_is_off: "{{ trigger.event.data.cleared_hold_is_off if trigger.event.data.target_sensor == this.entity_id else this.attributes.cleared_hold_is_off | default(none) }}"
              light_skip_is_on: "{{ trigger.event.data.light_skip_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.light_skip_is_on | default(none) }}"
              manual_override_is_on: "{{ trigger.event.data.manual_override_is_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.manual_override_is_on | default(none) }}"
              light_turn_on: "{{ trigger.event.data.light_turn_on if trigger.event.data.target_sensor == this.entity_id else this.attributes.light_turn_on | default(none) }}"
              light_turn_off: "{{ trigger.event.data.light_turn_off if trigger.event.data.target_sensor == this.entity_id else this.attributes.light_turn_off | default(none) }}"
              last_triggered_by: "{{ trigger.event.data.last_triggered_by if trigger.event.data.target_sensor == this.entity_id else this.attributes.last_triggered_by | default(none) }}"
    ```

    Add one `binary_sensor` entry per automation, each with its own `unique_id`.


    </details>
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    # --- Primary Targets ---
    base_occ:
      name: Base Occupancy Sensor or Helper (Required)
      description: >
        Sensor that is going to be used as a baseline for determining a room occupancy. 
        All other logic conditions will adjust the state of the smart occupancy sensor or helper based on the current state of this entity.
        Otherwise smart occupancy will follow the state of this entity if no other conditions are met.
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: occupancy
            - domain: input_boolean
          multiple: false

    smart_occ_helper:
      name: Smart Occupancy Boolean Helper (Optional)
      description: >
        Provide an input boolean helper if you want to track the state of the smart occupancy.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: false

    smart_occ_sensor:
      name: Smart Occupancy Template Sensor (Optional)
      description: >
        Provide a template sensor if you want to track the state of the smart occupancy with a binary sensor.
        The sensor should be configured to listen to the 'smart_occupancy_update' event.
      default: []
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
          multiple: false

    light_target:
      name: Light / Switch / Scene / Script Target (Optional)
      description: >
        Provide a Light, Switch, Scene, or Script that will be controlled based on the calculated smart occupancy.
        Areas, devices and labels only contribute their lights and switches; pick scenes and scripts directly.
      default: []
      selector:
        target:
          entity:
            domain:
              - switch
              - light
              - scene
              - script

    lighting_script:
      name: Secondary Lighting Script (Optional)
      description: >
        Optional script (e.g. the "Smart Area Occupancy - Lighting Script" blueprint) that receives the full
        occupancy, override and light data on every relevant change. Leave empty to skip it.
        A missing or failing script is ignored without errors.
      default: ""
      selector:
        entity:
          domain: script
          multiple: false

    # --- Advanced Light Controls ---
    advanced_light_controls:
      name: Advanced Light Controls (Scripts / Scenes)
      icon: mdi:lightbulb-auto-outline
      collapsed: true
      input:
        off_behavior:
          name: Off Behavior (Scripts ONLY)
          description: >
            If using a script above, and dont want to use a separate off script below, select how to handle the off behavior. If no off target script is provided, the off behavior will skip and do nothing.
          default: "repeat"
          selector:
            select:
              options:
                - label: "Repeat 'On' Target Script"
                  value: "repeat"
                - label: "Use 'Off' Target Script Provided Below"
                  value: "off"

        script_field_key:
          name: Script Field Key - Smart Occupancy State
          description: >
            The field name used in a provided script that will represent the on/off state of the "smart" occupancy logic. (e.g., smart_occupancy, occupancy_detected).
            Leave empty to use script.turn_on without any data, if used ensure it matches the field key of your script that will represent the smart occupancy state.
          default: ""
          selector:
            text:

        off_light_target:
          name: Off Scene / Script (Optional)
          description: >
            If using a scene or script above, provide a follow up scene or script to do when turning off the light / when calculated smart occupancy cleared.
          default: []
          selector:
            target:
              entity:
                domain:
                  - scene
                  - script

    # --- Automation Controls ---
    automation_controls:
      name: Automation Controls
      icon: mdi:cog
      collapsed: true
      input:
        use_automation_control:
          name: Disable Automation Control
          description: >
            This option will add a condition to run or disable the automation.
          default: "automation_control_disabled"
          selector:
            select:
              options:
                - label: "Enable Automation Control"
                  value: "automation_control_enabled"
                - label: "Disable Automation Control"
                  value: "automation_control_disabled"

        automation_control_entity:
          name: Disable Control Entity
          description: >
            Provide an entity that will allow the automation to be disabled
          default: []
          selector:
            entity:
              multiple: false

        automation_control_state:
          name: Disable Automation Control Entity Activation State
          description: >
            Select the state the entity helper must be in to disable the automation
          default: "off"
          selector:
            select:
              options:
                - label: "ON State"
                  value: "on"
                - label: "OFF State"
                  value: "off"

        fallback_state_sensor:
          name: State of Smart Occupancy Template Sensor On Disabled
          description: >
            When the automation is disabled what state should the smart occupancy TEMPLATE SENSOR go to
          default: "unavailable"
          selector:
            select:
              options:
                - label: "On"
                  value: "on"
                - label: "Off"
                  value: "off"
                - label: "Unavailable"
                  value: "unavailable"

    # --- Light Control Skip ---
    light_skip_section:
      name: Light Control Skip
      icon: mdi:lightbulb-off-outline
      collapsed: true
      input:
        use_light_skip:
          name: Light Control Skip
          description: >
            This option will add a condition to only run the smart occupancy logic portion and skip light controls.
          default: "light_control_skip_disabled"
          selector:
            select:
              options:
                - label: "Enable Light Control Skip"
                  value: "light_control_skip_enabled"
                - label: "Disable Light Control Skip"
                  value: "light_control_skip_disabled"

        light_skip_entity:
          name: Disable Light Control Entity
          description: >
            Provide an entity that will allow the Light Controls to be disabled
          default: []
          selector:
            entity:
              multiple: true

        light_skip_state:
          name: Disable Light Control Entity Activation State
          description: >
            Select the state the entity helper must be in to disable the automation
          default: "off"
          selector:
            select:
              options:
                - label: "On"
                  value: "on"
                - label: "Off"
                  value: "off"

        light_skip_triggered_on_state:
          name: Light Skip Triggered - On State
          description: >
            Select the state the light entity or script will fall to when the light skip condtion is triggered.
            Smart Occupancy will allow the light to follow the state if manual control was changed at time of skipping. Follow Smart Occupancy will also follow the environment conditions.
          default: "current"
          selector:
            select:
              options:
                - label: "Follow Smart Occupancy"
                  value: "smart_occ"
                - label: "Current State"
                  value: "current"
                - label: "On"
                  value: "on"
                - label: "Off"
                  value: "off"

        light_skip_triggered_off_state:
          name: Light Skip Released State
          description: >
            Select what happens to lights when the light skip condition is released (turns off).
            Smart Occupancy will immediately re-apply the current calculated occupancy state. Follow Smart Occupancy will also follow the environment conditions.
          default: "smart_occ"
          selector:
            select:
              options:
                - label: "Follow Smart Occupancy"
                  value: "smart_occ"
                - label: "Current State"
                  value: "current"
                - label: "On"
                  value: "on"
                - label: "Off"
                  value: "off"

        light_skip_type_on:
          name: Light Skip Detection Type - On Trigger
          description: >
            For the light skip ON trigger, choose between Any or All sensors being in the detected state
          default: "any"
          selector:
            select:
              options:
                - label: "Any"
                  value: "any"
                - label: "All"
                  value: "all"

        light_skip_type_off:
          name: Light Skip Detection Type - Off Trigger
          description: >
            For the light skip OFF trigger, choose between Any or All sensors being in the detected state
            Note: Off trigger is now derived as the inverse of the On trigger
            to prevent dead-zone conditions. This setting is retained for
            compatibility but does not affect behavior.
          default: "all"
          selector:
            select:
              options:
                - label: "Any"
                  value: "any"
                - label: "All"
                  value: "all"

    # --- Timing & Grace Periods ---
    timing_section:
      name: Timing, Grace Periods & Buffers
      icon: mdi:timer-sand
      collapsed: true
      input:
        base_occ_on_delay:
          name: Base Occupancy - ON Delay
          description: >
            Base occupancy must stay detected this long before it counts as occupied. Filters out brief false detections. 0 = immediate.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        base_occ_off_delay:
          name: Base Occupancy - OFF Delay (Extended Presence Buffer)
          description: >
            Base occupancy must stay clear this long before smart occupancy can clear. Keeps the room "occupied" while someone
            sits still. Re-detection inside this window cancels the timer automatically. 0 = immediate.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        light_off_grace:
          name: Light Off Grace Period
          description: >
            Smart occupancy clears immediately, but lights stay on until it has stayed clear for this long.
            If the area is re-occupied inside the window the lights are never turned off. 0 = turn off immediately.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

    # --- Manual Override ---
    manual_override_section:
      name: Manual Control Override
      icon: mdi:gesture-tap
      collapsed: true
      input:
        use_manual_override:
          name: Manual Control Override
          description: >
            When a monitored light/switch is changed by hand, pause the automation until the override resets.
            Requires the override helper and monitored entities below.
          default: "override_disabled"
          selector:
            select:
              options:
                - label: "Enable Manual Override"
                  value: "override_enabled"
                - label: "Disable Manual Override"
                  value: "override_disabled"

        manual_override_helper:
          name: Override Helper (input_boolean)
          description: >
            Helper that holds the "override active" state so it survives restarts. Create one per area.
          default: []
          selector:
            entity:
              domain: input_boolean
              multiple: false

        override_entities:
          name: Monitored Lights / Switches
          description: >
            Entities watched for manual changes (usually the same lights/switches you control).
            Only on/off state changes are detected; changes made by automations and scripts are ignored.
          default: []
          selector:
            entity:
              domain:
                - light
                - switch
              multiple: true

        override_detection:
          name: Manual Change Detection
          description: >
            "Any non-automation change" counts wall switches, dashboards, apps and voice. If a device echoes its own state after
            an automation command and causes false overrides, choose "Dashboard / app / voice only".
          default: "any"
          selector:
            select:
              options:
                - label: "Any non-automation change (wall switch, dashboard, voice)"
                  value: "any"
                - label: "Dashboard / app / voice only (ignore physical switches)"
                  value: "user_only"
                - label: "Anything not made by this automation (also smart buttons / remotes run by other automations)"
                  value: "not_this"

        override_attribute_changes:
          name: Count Brightness / Color Changes
          description: >
            Also start an override when a light that is already on is dimmed or changes color.
            If transitions or device reports cause false overrides, turn this off or use "Dashboard / app / voice only".
          default: false
          selector:
            boolean:

        override_scope:
          name: What Freezes During Override
          description: >
            "Lights only" keeps tracking smart occupancy (sensors/helper stay accurate) but sends no light commands.
            "Everything" also pauses occupancy tracking until the override resets.
          default: "lights"
          selector:
            select:
              options:
                - label: "Light control only"
                  value: "lights"
                - label: "Everything (occupancy tracking too)"
                  value: "all"

        override_reset_modes:
          name: Reset Override When
          description: >
            Choose how the override ends. "Area clear" keeps your manual setting for as long as the room stays occupied.
          default: ["area_clear"]
          selector:
            select:
              multiple: true
              options:
                - label: "Area has been clear for the buffer time below"
                  value: "area_clear"
                - label: "Timeout since the override started"
                  value: "timeout"

        override_clear_delay:
          name: Area Clear Buffer
          description: >
            How long smart occupancy must stay clear before the override resets. Protects against someone being briefly
            "not seen" in an occupied room. Tune per room (a sensor that misses still people needs a longer buffer).
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:

        override_timeout:
          name: Override Timeout
          description: >
            Hard limit: the override always resets this long after it started. Only used when "Timeout" is selected above.
          default:
            hours: 1
            minutes: 0
            seconds: 0
          selector:
            duration:

        override_release_action:
          name: When Override Resets
          description: >
            "Sync lights" applies the current smart occupancy state to the lights (on if occupied, off if clear).
            "Do nothing" leaves the lights as they are until the next occupancy change.
          default: "sync"
          selector:
            select:
              options:
                - label: "Sync lights to smart occupancy"
                  value: "sync"
                - label: "Do nothing"
                  value: "none"

    # --- Advance Logic Controls ---
    logic_controls:
      name: Smart Occupancy Logic Controls
      icon: mdi:brain
      collapsed: true
      input:
        smart_occ_rising_edge:
          name: Smart Occupancy Rising Edge Requirement
          description: >
            Choose which conditions will be used to determine how the smart occupancy state goes from "Cleared" to "Detected".
            Anything left unchecked will not be used to trigger the smart occupancy state even if the condtions are met.
            For example, leaving out Detected hold will not trigger the smart occupancy to go to detected, however it can still be used to hold detected state once its in there and can prevent clearing.
          default: ["base_occ", "entering"]
          selector:
            select:
              multiple: true
              options:
                - label: "Base Occupancy - Detected"
                  value: "base_occ"
                - label: "Entering Conditions - ON / Match Control State"
                  value: "entering"
                - label: "Leaving Conditions - OFF / Opposite Control State"
                  value: "leaving"

        smart_occ_rising_edge_type_on:
          name: Smart Occupancy Rising Edge Detection Type - On Trigger
          description: >
            For the smart occupancy rising edge ON trigger, choose between Any or All selected conditions 
            being in their "on" state to trigger the smart occupancy to turn ON (detected state).
          default: "any"
          selector:
            select:
              options:
                - label: "Any"
                  value: "any"
                - label: "All"
                  value: "all"

        smart_occ_detected_hold_rising_edge:
          name: Smart Occupancy Detected Hold Rising Edge Trigger
          description: >
            Choose whether the detected hold will trigger a change of state to detected or only hold when the detected state from another condtion and prevent clearing if enabled.
          default: "trigger_and_hold"
          selector:
            select:
              options:
                - label: "Trigger and Hold Detection"
                  value: "trigger_and_hold"
                - label: "Hold Detection Only (Prevent Clearing)"
                  value: "hold"

        smart_occ_falling_edge:
          name: Smart Occupancy Falling Edge Requirement
          description: >
            Choose which conditions will be used to determine how the smart occupancy state goes from "Detected" to "Cleared".
            Anything left unchecked will not be used to trigger the smart occupancy state even if the condtions are met.
            For example, leaving out Leaving will not trigger the smart occupancy to go to cleared, however it can still be used to hold cleared state once its in there and can prevent detected.
          default: ["base_occ", "leaving"]
          selector:
            select:
              multiple: true
              options:
                - label: "Base Occupancy - Cleared"
                  value: "base_occ"
                - label: "Entering Conditions - OFF / Opposite Control State"
                  value: "entering"
                - label: "Leaving Conditions - ON / Match Control State"
                  value: "leaving"

        smart_occ_falling_edge_type_off:
          name: Smart Occupancy Falling Edge Detection Type - Off Trigger
          description: >
            For the smart occupancy falling edge OFF trigger, choose between Any or All selected conditions 
            being in their "off" state to allow the smart occupancy to turn OFF (cleared state).
          default: "all"
          selector:
            select:
              options:
                - label: "Any"
                  value: "any"
                - label: "All"
                  value: "all"

        smart_occ_cleared_hold_falling_edge:
          name: Smart Occupancy Cleared Hold Falling Edge Trigger
          description: >
            Choose whether the cleared hold will trigger a change of state to cleared or only hold when the cleared state from another condition and prevent detected if enabled.
          default: "trigger_and_hold"
          selector:
            select:
              options:
                - label: "Trigger and Hold Clear"
                  value: "trigger_and_hold"
                - label: "Hold Clear Only (Prevent Detected)"
                  value: "hold"

        smart_occ_hold_priority:
          name: Smart Occupancy Hold Priority
          description: >
            Choose which hold will take priority when both are active. The first hold will take priority and the second will be ignored if chosen.
          default: "first"
          selector:
            select:
              options:
                - label: "First"
                  value: "first"
                - label: "Detected"
                  value: "detected"
                - label: "Cleared"
                  value: "cleared"

        smart_occ_rising_edge_delay:
          name: Smart Occupancy Rising Edge Delay (Detected Delay)
          description: >
            How long the rising edge (your selected rising conditions, e.g. Entering only) must stay true before
            smart occupancy turns ON. Applied on top of the per-group delays. If the rising edge drops, or the
            falling edge also becomes true, before the delay ends the timer resets.
            Detected holds set to "Trigger and Hold" are not delayed. 0 = immediate.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        smart_occ_falling_edge_delay:
          name: Smart Occupancy Falling Edge Delay (Cleared Delay)
          description: >
            How long the falling edge (your selected falling conditions, e.g. base cleared + entering cleared, or
            leaving) must stay true before smart occupancy turns OFF. Applied on top of the per-group delays.
            If the falling edge drops, or the rising edge returns (re-detection), before the delay ends the timer resets.
            Cleared holds set to "Trigger and Hold" are not delayed. 0 = immediate.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

    # --- Occupancy Entering Conditions ---
    entering_section:
      name: Occupancy Entering Conditions
      icon: mdi:door-open
      collapsed: true
      input:
        use_entering:
          name: Use Entering Conditions

                  value: "use_lux_enabled"
                - label: "Disable Illuminance Conditions"
                  value: "use_lux_disabled"
        lux_sensor:
          name: Illuminance Sensor
          description: >
            Sensor used for detection of when to turn on/off lights.
          default: []
          selector:
            entity:

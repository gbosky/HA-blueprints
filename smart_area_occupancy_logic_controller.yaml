          default: 80
          selector:
            number:
              min: 0
              max: 1000
              step: 1
              unit_of_measurement: lux
              mode: slider
        lux_high_val_delay:
          name: Illuminance High Lux Delay
          description: >
            Set how long the illuminance level must remain above the High Lux Value.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:
        lux_turn_off_when_bright:
          name: Turn Lights Off When Bright
          description: >
            Turn lights off while occupied when lux stays above the High Lux Value. Only enable this when the
            sensor is NOT lit by the lights it controls (e.g. a window/outdoor sensor), otherwise lights will

blueprint:
  name: "Smart Area Occupancy - Lighting Script 💡🕹️"
  description: |
    **Version: 2.1.1**

    This script is a companion to the **Smart Area Occupancy** blueprint.
    The controller treats it like one more light that receives a much richer command:
    it decides *when* the area is detected/cleared, this script decides *how* to light it.

    Use it for things the built-in light control can't do - overhead lights during the day
    and accent lights at night, a scene per time of day, a dim night-light while a detected
    hold is active, or a goodbye scene when the area clears.


    <details>
    <summary><b>📖 Full Documentation</b></summary>


    ## 🎯 Purpose

    The Smart Area Occupancy blueprint calculates a rich occupancy state and passes it to this
    script on every relevant change. The script is organised in three sections:

    1. **Light Command** - act like a light: `light_turn_on` / `light_turn_off` already include the
       controller's sun/illuminance checks, light-off grace period, light skip and manual override.
       Put your main lighting logic here (branch on time of day, holds, etc.).
    2. **Events** - one-shot moments: occupancy detected/cleared, manual override started/released,
       light skip activated/released, time window opened/closed, automation control disabled.
    3. **State Blocks** - level conditions that are true for as long as they last (entering active,
       hold active, ...). These fire on *every* call while true, so use them for context, not one-shot actions.

    Each block has a stub notification that only fires when its condition is true. Replace the stubs
    with your own actions and delete the blocks you don't need.

    This script blueprint has no inputs and is intended to be customized by taking control.


    ## 🧩 Fields Received

    - `smart_occupancy_state` → Calculated Smart Occupancy state (`on` / `off`)
    - `previous_state` / `state_changed` → State before this update and whether it changed
    - `occupancy_event` → `detected` / `cleared` when the state just changed, otherwise `none`
    - `light_command` → `on` / `off` / `none` (also as `light_turn_on` / `light_turn_off` booleans)
    - `smart_occupancy_rising_trigger` / `smart_occupancy_falling_trigger` → Edge evaluation results
    - `detect_pending` / `clear_pending` → An edge delay is running (e.g. warn/dim before the area clears)
    - `base_occupancy_state` → Current state of the base occupancy sensor (`on` / `off`)
    - `entering_is_on` / `entering_is_off`, `leaving_is_on` / `leaving_is_off`
    - `detected_hold_is_on` / `detected_hold_is_off`, `cleared_hold_is_on` / `cleared_hold_is_off`
    - `light_skip_is_on` / `light_skip_event` (`activated` / `released` / `none`)
    - `manual_override_is_on` / `override_event` (`started` / `released` / `none`)
    - `automation_control_is_disabled`
    - `env_allows_on` (sun / lux / time window) / `env_too_bright` / `illuminance` / `sun_elevation`
    - `time_in_window` → Inside the controller's time window (true when it's disabled)
    - `manual_button_command` → `on` / `off` from a manual control button press
    - Time window edges arrive with `last_triggered_by` = `time window start` / `time window end`
    - Changes of the controller's *Lighting Script Refresh Entities* arrive with `last_triggered_by` = `script refresh`
    - `grace_pending` → Area cleared but the light-off grace period is still running
    - `last_triggered_by` / `trigger_entity` → Trigger ID and entity behind this update
    - `state` (or your **Script Field Key**) → Same value as `smart_occupancy_state`

    Booleans may arrive as real booleans or as `"true"`/`"false"` strings; every condition below
    normalises them with `| string | lower == 'true'`.


    ## 💡 Example Use Cases

    | Goal | Where |
    |------|-------|
    | Overhead lights by day, accent lights at night | **Light Command - On** (see the commented example) |
    | Turn everything off | **Light Command - Off** |
    | Goodbye scene the moment the area clears | **Event - Occupancy Cleared** |
    | Dim instead of off while a detected hold is active | **State - Detected Hold Is On** |
    | Flash a light when someone takes manual control | **Event - Manual Override Started** |
    | React when automation control disables the automation | **Event - Automation Control Disabled** |


    ## 🛠️ Getting Started

    1. Click the **3 dots → Take Control** in the script editor to unlock editing
    2. Leave the script unedited to test with debug notifications, or start replacing stub actions immediately
    3. Select it in the **Secondary Lighting Script** input of your Smart Area Occupancy automation
       (optional - the controller skips it silently when empty, and any lights in its target still work)
    4. Replace the stub `persistent_notification` actions with your own actions
    5. Delete any blocks you don't need
    6. Remove the **Debug — All Field Values** block when you're done testing


    ## 🐛 Debug Notifications

    When left unmodified, this script fires a single debug notification on every run showing every
    field passed from the occupancy automation, plus one notification per block that matched.

    **Remove the debug block and all stub notifications once your actions are in place.**

    </details>

  domain: script

fields:
  smart_occupancy_state:
    description: "Calculated Smart Occupancy State - On/Off"
    example: "on"
    required: false
  previous_state:
    description: "Smart Occupancy State before this update"
    example: "off"
    required: false
  state_changed:
    description: "Smart Occupancy State changed on this update"
    example: "true"
    required: false
  occupancy_event:
    description: "detected / cleared when the state just changed, otherwise none"
    example: "detected"
    required: false
  light_command:
    description: "What a light would be told to do - on / off / none"
    example: "on"
    required: false
  light_turn_on:
    description: "Light turn on command (includes sun/lux, skip and override checks)"
    example: "true"
    required: false
  light_turn_off:
    description: "Light turn off command (includes grace period, skip and override checks)"
    example: "false"
    required: false
  smart_occupancy_rising_trigger:
    description: "Occupancy detected — rising edge"
    example: "true"
    required: false
  smart_occupancy_falling_trigger:
    description: "Occupancy cleared — falling edge"
    example: "false"
    required: false
  detect_pending:
    description: "Rising edge is asserting but the Rising Edge Delay is still running"
    example: "false"
    required: false
  clear_pending:
    description: "Falling edge is asserting but the Falling Edge Delay is still running"
    example: "false"
    required: false
  base_occupancy_state:
    description: "Current state of the base occupancy sensor"
    example: "on"
    required: false
  entering_is_on:
    description: "Entering condition is currently active"
    example: "true"
    required: false
  entering_is_off:
    description: "Entering condition is currently inactive"
    example: "false"
    required: false
  leaving_is_on:
    description: "Leaving condition is currently active"
    example: "false"
    required: false
  leaving_is_off:
    description: "Leaving condition is currently inactive"
    example: "true"
    required: false
  detected_hold_is_on:
    description: "Detected hold condition is currently active"
    example: "true"
    required: false
  detected_hold_is_off:
    description: "Detected hold condition is currently inactive"
    example: "false"
    required: false
  cleared_hold_is_on:
    description: "Cleared hold condition is currently active"
    example: "false"
    required: false
  cleared_hold_is_off:
    description: "Cleared hold condition is currently inactive"
    example: "true"
    required: false
  light_skip_is_on:
    description: "Light skip condition is currently active — light control is being bypassed"
    example: "false"
    required: false
  light_skip_event:
    description: "activated / released when light skip just changed, otherwise none"
    example: "none"
    required: false
  automation_control_is_disabled:
    description: "Automation control entity is active and currently disabling the automation"
    example: "false"
    required: false
  manual_override_is_on:
    description: "Manual override is active - the controller has paused automatic light control"
    example: "false"
    required: false
  override_event:
    description: "started / released when the manual override just changed, otherwise none"
    example: "none"
    required: false
  env_allows_on:
    description: "Sun / illuminance / time window conditions allow lights to turn on"
    example: "true"
    required: false
  time_in_window:
    description: "Inside the controller's time window (always true when the time window is disabled)"
    example: "true"
    required: false
  manual_button_command:
    description: "on / off sent by a manual control button press (only on button-press updates)"
    example: "off"
    required: false
  env_too_bright:
    description: "Sun / illuminance say it is bright enough to turn lights off"
    example: "false"
    required: false
  illuminance:
    description: "Current illuminance reading (none when not configured)"
    example: "12"
    required: false
  sun_elevation:
    description: "Current sun elevation"
    example: "-4.2"
    required: false
  grace_pending:
    description: "Area cleared but the light-off grace period is still running"
    example: "false"
    required: false
  last_triggered_by:
    description: "Trigger ID that caused this update"
    example: "base occupancy on"
    required: false
  trigger_entity:
    description: "Entity that caused this update (empty for startup/reload)"
    example: "binary_sensor.office_occupancy"
    required: false

sequence:
  # Always fires — full state dump for debugging
  - alias: "Debug — All Field Values"
    action: persistent_notification.create
    data:
      title: "Occupancy Script Debug"
      notification_id: "occupancy_debug"
      message: >
        Last Triggered By:                  {{ last_triggered_by | default('not provided') }}

        Trigger Entity:                     {{ trigger_entity | default('not provided') }}


        Smart Occupancy State:              {{ smart_occupancy_state | default('not provided') }}

        Previous State / Changed:           {{ previous_state | default('not provided') }} / {{ state_changed | default('not provided') }}

        Occupancy Event:                    {{ occupancy_event | default('not provided') }}

        Light Command:                      {{ light_command | default('not provided') }}

        Smart Occupancy Rising Trigger:     {{ smart_occupancy_rising_trigger | default('not provided') }}

        Smart Occupancy Falling Trigger:    {{ smart_occupancy_falling_trigger | default('not provided') }}

        Detect / Clear Pending:             {{ detect_pending | default('not provided') }} / {{ clear_pending | default('not provided') }}


        Base Occupancy State:               {{ base_occupancy_state | default('not provided') }}

        Entering Is On / Off:               {{ entering_is_on | default('not provided') }} / {{ entering_is_off | default('not provided') }}

        Leaving Is On / Off:                {{ leaving_is_on | default('not provided') }} / {{ leaving_is_off | default('not provided') }}

        Detected Hold Is On / Off:          {{ detected_hold_is_on | default('not provided') }} / {{ detected_hold_is_off | default('not provided') }}

        Cleared Hold Is On / Off:           {{ cleared_hold_is_on | default('not provided') }} / {{ cleared_hold_is_off | default('not provided') }}


        Light Skip Is On / Event:           {{ light_skip_is_on | default('not provided') }} / {{ light_skip_event | default('not provided') }}

        Manual Override Is On / Event:      {{ manual_override_is_on | default('not provided') }} / {{ override_event | default('not provided') }}

        Automation Control Is Disabled:     {{ automation_control_is_disabled | default('not provided') }}

        Grace Pending:                      {{ grace_pending | default('not provided') }}


        Env Allows On / Too Bright:         {{ env_allows_on | default('not provided') }} / {{ env_too_bright | default('not provided') }}

        Time In Window:                     {{ time_in_window | default('not provided') }}

        Manual Button Command:              {{ manual_button_command | default('not provided') }}

        Illuminance / Sun Elevation:        {{ illuminance | default('not provided') }} / {{ sun_elevation | default('not provided') }}

  # ==========================================================================
  # 1. LIGHT COMMAND - act like a light
  # ==========================================================================
  - alias: "Light Command"
    choose:
      - alias: "Light Command - On"
        conditions:
          - condition: template
            value_template: "{{ light_turn_on | default(false) | string | lower == 'true' }}"
        sequence:
          # Example - overhead by day, accent lights in the evening/night:
          # - if:
          #     - condition: time
          #       after: "07:00:00"
          #       before: "20:00:00"
          #   then:
          #     - action: light.turn_on
          #       target:
          #         entity_id: light.overhead
          #   else:
          #     - action: light.turn_on
          #       target:
          #         entity_id: light.accent
          #       data:
          #         brightness_pct: 40
          - alias: "🔧 YOUR ACTIONS HERE — Light Command On"
            action: persistent_notification.create
            data:
              title: "Light Command — On"
              notification_id: "light_on_trigger"
              message: "Light Turn On is true — replace this with your actions"

      - alias: "Light Command - Off"
        conditions:
          - condition: template
            value_template: "{{ light_turn_off | default(false) | string | lower == 'true' }}"
        sequence:
          - alias: "🔧 YOUR ACTIONS HERE — Light Command Off"
            action: persistent_notification.create
            data:
              title: "Light Command — Off"
              notification_id: "light_off_trigger"
              message: "Light Turn Off is true — replace this with your actions"

  # ==========================================================================
  # 2. EVENTS - fire once, on the update where they happen
  # ==========================================================================
  - alias: "Event - Occupancy Detected"
    if:
      - condition: template
        value_template: "{{ occupancy_event | default('none') | string | lower == 'detected' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Occupancy Detected"
        action: persistent_notification.create
        data:
          title: "Event — Occupancy Detected"
          notification_id: "occupancy_event_detected"
          message: "Smart occupancy just turned on — replace this with your actions"

  - alias: "Event - Occupancy Cleared"
    if:
      - condition: template
        value_template: "{{ occupancy_event | default('none') | string | lower == 'cleared' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Occupancy Cleared"
        action: persistent_notification.create
        data:
          title: "Event — Occupancy Cleared"
          notification_id: "occupancy_event_cleared"
          message: "Smart occupancy just turned off — replace this with your actions"

  - alias: "Event - Manual Override Started"
    if:
      - condition: template
        value_template: "{{ override_event | default('none') | string | lower == 'started' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Manual Override Started"
        action: persistent_notification.create
        data:
          title: "Event — Manual Override Started"
          notification_id: "occupancy_override_started"
          message: "A manual light change or button press paused automatic control — replace this with your actions"

  - alias: "Event - Manual Override Released"
    if:
      - condition: template
        value_template: "{{ override_event | default('none') | string | lower == 'released' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Manual Override Released"
        action: persistent_notification.create
        data:
          title: "Event — Manual Override Released"
          notification_id: "occupancy_override_released"
          message: "Manual override ended — replace this with your actions"

  - alias: "Event - Light Skip Activated / Released"
    if:
      - condition: template
        value_template: "{{ light_skip_event | default('none') | string | lower in ['activated', 'released'] }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Light Skip Changed"
        action: persistent_notification.create
        data:
          title: "Event — Light Skip {{ light_skip_event | default('') | title }}"
          notification_id: "occupancy_light_skip_event"
          message: "Light skip was {{ light_skip_event }} — replace this with your actions"

  - alias: "Event - Time Window Opened / Closed"
    if:
      - condition: template
        value_template: "{{ last_triggered_by | default('') in ['time window start', 'time window end'] }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Time Window Edge"
        action: persistent_notification.create
        data:
          title: "Event — Time Window {{ 'Opened' if last_triggered_by == 'time window start' else 'Closed' }}"
          notification_id: "occupancy_time_window_edge"
          message: >-
            The time window {{ 'opened' if last_triggered_by == 'time window start' else 'closed' }}
            (the controller's start/end action is already in light_command) — replace this with your actions

  - alias: "Event - Automation Control Disabled"
    if:
      - condition: template
        value_template: "{{ last_triggered_by | default('') == 'automation disabled' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Automation Control Disabled"
        action: persistent_notification.create
        data:
          title: "Event — Automation Control Disabled"
          notification_id: "occupancy_automation_control_disabled"
          message: "Automation control has disabled the automation (lights left as they are) — replace this with your actions"

  # ==========================================================================
  # 3. STATE BLOCKS - true for as long as the condition lasts (fire every call)
  # ==========================================================================
  - alias: "State - Smart Occupancy On"
    if:
      - condition: template
        value_template: "{{ smart_occupancy_state | default('') | string | lower == 'on' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Smart Occupancy State is On"
        action: persistent_notification.create
        data:
          title: "State — Smart Occupancy On"
          notification_id: "occupancy_state_on"
          message: "Smart Occupancy State is on — replace this with your actions"

  - alias: "State - Smart Occupancy Off"
    if:
      - condition: template
        value_template: "{{ smart_occupancy_state | default('') | string | lower == 'off' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Smart Occupancy State is Off"
        action: persistent_notification.create
        data:
          title: "State — Smart Occupancy Off"
          notification_id: "occupancy_state_off"
          message: "Smart Occupancy State is off — replace this with your actions"

  - alias: "State - Entering Is On"
    if:
      - condition: template
        value_template: "{{ entering_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Entering Is On"
        action: persistent_notification.create
        data:
          title: "State — Entering Is On"
          notification_id: "occupancy_entering_is_on"
          message: "Entering Is On is true — replace this with your actions"

  - alias: "State - Leaving Is On"
    if:
      - condition: template
        value_template: "{{ leaving_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Leaving Is On"
        action: persistent_notification.create
        data:
          title: "State — Leaving Is On"
          notification_id: "occupancy_leaving_is_on"
          message: "Leaving Is On is true — replace this with your actions"

  - alias: "State - Detected Hold Is On"
    if:
      - condition: template
        value_template: "{{ detected_hold_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Detected Hold Is On"
        action: persistent_notification.create
        data:
          title: "State — Detected Hold Is On"
          notification_id: "occupancy_detected_hold_is_on"
          message: "Detected Hold Is On is true — replace this with your actions"

  - alias: "State - Cleared Hold Is On"
    if:
      - condition: template
        value_template: "{{ cleared_hold_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Cleared Hold Is On"
        action: persistent_notification.create
        data:
          title: "State — Cleared Hold Is On"
          notification_id: "occupancy_cleared_hold_is_on"
          message: "Cleared Hold Is On is true — replace this with your actions"

  - alias: "State - Light Skip Is On"
    if:
      - condition: template
        value_template: "{{ light_skip_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Light Skip Is On"
        action: persistent_notification.create
        data:
          title: "State — Light Skip Is On"
          notification_id: "occupancy_light_skip_is_on"
          message: "Light Skip Is On is true — replace this with your actions"

  - alias: "State - Manual Override Is On"
    if:
      - condition: template
        value_template: "{{ manual_override_is_on | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Manual Override Is On"
        action: persistent_notification.create
        data:
          title: "State — Manual Override Is On"
          notification_id: "occupancy_manual_override_on"
          message: "Manual override is active — light_turn_on/off stay false until it resets"

  - alias: "State - Clear Pending (Falling Edge Delay running)"
    if:
      - condition: template
        value_template: "{{ clear_pending | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Clear Pending"
        action: persistent_notification.create
        data:
          title: "State — Clear Pending"
          notification_id: "occupancy_clear_pending"
          message: "The area will clear when the falling edge delay ends — e.g. dim lights as a warning here"

  - alias: "State - Grace Period Pending"
    if:
      - condition: template
        value_template: "{{ grace_pending | default(false) | string | lower == 'true' }}"
    then:
      - alias: "🔧 YOUR ACTIONS HERE — Grace Pending"
        action: persistent_notification.create
        data:
          title: "State — Grace Period Pending"
          notification_id: "occupancy_grace_pending"
          message: "Area cleared, lights will turn off when the grace period ends — e.g. dim them here"

# restart: the controller starts this script non-blocking; a newer occupancy
# update supersedes any run still in progress.
mode: restart
